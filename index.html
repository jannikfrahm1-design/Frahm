<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Frahm</title>
<meta name="apple-mobile-web-app-title" content="Frahm">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F6B4F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Sticky header with search, five pages side by side in a swipeable track, bottom bar with a raised Home button. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface-2:#E3EAE2; --fg:#15221B; --muted:#5B6B62; --line:#D3DDD3;
  --accent:#1F6B4F; --accent-ink:#FFFFFF; --accent-soft:#D6EBDF; --sun:#F2B705; --sun-soft:#FDF1C7; --danger:#B4412F;
  --rest:#4A4F55; --bio:#7A5A2E; --gelb:#E2B100; --papier:#2F64B4;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --surface:#17221C; --surface-2:#1F2C25; --fg:#E6EEE9; --muted:#97A89E; --line:#2A3830;
  --accent:#5CC59A; --accent-ink:#0B1A13; --accent-soft:#1D3A2D; --sun:#F5C842; --sun-soft:#3A3115; --danger:#E7816F;
  --rest:#9AA1A8; --bio:#C29A61; --gelb:#F2CB3A; --papier:#79A6EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#17221C; --surface-2:#1F2C25; --fg:#E6EEE9; --muted:#97A89E; --line:#2A3830;
  --accent:#5CC59A; --accent-ink:#0B1A13; --accent-soft:#1D3A2D; --sun:#F5C842; --sun-soft:#3A3115; --danger:#E7816F;
  --rest:#9AA1A8; --bio:#C29A61; --gelb:#F2CB3A; --papier:#79A6EC; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.topline{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.brand span{color:var(--accent)}
.today{color:var(--muted);font-size:14px;font-weight:500;text-align:right}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 40px 11px 42px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;border-radius:10px;color:var(--muted)}
.viewport{flex:1;min-height:0;overflow:hidden;position:relative}
.track{display:flex;height:100%;width:600%;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.track.drag{transition:none}
.page{width:16.6667%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 110px}
.page>*+*{margin-top:18px}
h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:14px}
.searchres{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.res b{display:block;font-weight:600}
.res small{color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:auto;white-space:nowrap}

/* Home */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center}
.hero h2{color:inherit;font-size:22px}
.hero p{margin:4px 0 0;opacity:.9;font-size:15px}
.ring{flex:none;width:76px;height:76px;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.alert{display:flex;gap:12px;align-items:center;background:var(--sun-soft);border:1px solid var(--sun);border-radius:var(--r);padding:14px}
.alert b{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px;min-width:0}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.open-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.open-list li{display:flex;justify-content:space-between;gap:10px;font-size:15px}

/* Aufgaben */
.daybar{display:flex;align-items:center;gap:8px}
.daybar h2{flex:1;text-align:center;font-size:20px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.slot{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;transition:background .2s}
.task.done{background:var(--accent-soft);border-color:transparent}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.task.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:18px;height:18px}
.task .txt{flex:1;min-width:0}
.task .txt b{display:block;font-weight:600}
.task.done .txt b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--accent)}
.task .who{font-size:13px;color:var(--muted)}
.task.done .who{color:var(--fg)}
.undo{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sun-soft);color:var(--fg)}
.note{font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:12px 14px}

/* Müll */
.bins{display:flex;flex-direction:column;gap:10px}
.bin{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.can{flex:none;width:40px;height:46px;border-radius:6px 6px 10px 10px;position:relative;background:var(--c)}
.can::before{content:"";position:absolute;left:-4px;right:-4px;top:-6px;height:8px;border-radius:4px;background:var(--c);filter:brightness(.8)}
.bin .txt{flex:1;min-width:0}
.bin .txt b{display:block}
.bin .when{font-family:var(--display);font-weight:800;font-size:18px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bin .when small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.soon .when{color:var(--danger)}
.form{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.frow label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.frow .lbl{grid-column:1/-1;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.form input,.form select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:14px;padding:13px 18px;font-size:16px}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
a{color:var(--accent);font-weight:600}

/* Familie */
.people{display:flex;flex-direction:column;gap:10px}
.person{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;background:var(--c)}
.person .txt{flex:1;min-width:0}
.person .txt b{display:block;font-size:17px}
.person .bd{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.person .bd strong{display:block;font-family:var(--display);font-size:18px;color:var(--fg)}
.person.bday{border-color:var(--sun);background:var(--sun-soft)}
.person.slim{padding:0;border:0;background:none}
.person.slim .av{width:40px;height:40px;font-size:17px}
.pill.home{background:var(--accent-soft);color:var(--accent)}
.pill.away{background:var(--surface-2);color:var(--muted)}
.wkwrap{overflow-x:auto;margin:0 -4px}
.wk{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.wk th,.wk td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.wk thead th button{border:0;background:none;font-weight:700;font-size:13px;color:var(--fg);padding:2px 0;border-bottom:3px solid var(--c)}
.wk tbody th{text-align:left;color:var(--muted);font-weight:700}
.wk tr.now td,.wk tr.now th{background:var(--accent-soft)}
.wk .ho{display:inline-block;font-style:normal;font-size:10px;font-weight:800;margin-left:3px;padding:1px 4px;border-radius:6px;background:var(--sun-soft);color:var(--fg)}
.sday{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip.sm{padding:6px 12px;font-size:14px}
.bhero{display:flex;align-items:center;gap:14px}
.bhero .av{width:56px;height:56px;color:#fff}
.bic{font-size:22px;flex:none}
/* Wetter */
.wx{padding:14px 14px 10px}
.wxtop{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:0;text-align:left;color:inherit}
.wxem{font-size:44px;line-height:1}
.wxt{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.wxhl{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;line-height:1.5}
.hscroll{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:12px -14px 0;padding:0 14px 4px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.wxc{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums;scroll-snap-align:start}
.wxc b{font-size:15px}
.wxc .ic2{font-size:20px;line-height:1.2}
.wxc .rb{width:8px;height:34px;border-radius:4px;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.wxc .rb i{display:block;width:100%;background:var(--papier);border-radius:4px 4px 0 0}
.tiny{font-size:11px;color:var(--muted)}
/* Assistent */
.ai{border-color:var(--accent);box-shadow:0 2px 0 var(--accent-soft)}
.aihead{display:flex;align-items:center;gap:8px;font-weight:800;font-family:var(--display);font-size:15px;color:var(--accent);margin-bottom:8px}
.aibody p{margin:0 0 8px}
.aibody p:last-child{margin-bottom:0}
.ailist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ailist li{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:9px 12px}
.ailist li span{min-width:0}
.ailist li small{display:block;color:var(--muted)}
.aibtn{flex:none;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;padding:7px 12px}
.aibtn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.askchips{display:flex;gap:8px}
.askchips .chip{flex:none;font-size:14px;padding:8px 14px;white-space:nowrap}
.wxc.now b{color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0 2px;font-size:14px}
.wxchart{width:100%;height:auto;display:block;touch-action:pan-y}
.wxchart text{font-size:10px;fill:var(--muted);font-family:var(--body)}
.wxread{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:15px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.wxdays{display:flex;flex-direction:column}
.wxday{display:grid;grid-template-columns:62px 30px 52px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:15px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.wxday[aria-pressed="true"]{font-weight:700}
.wxrange{position:relative;height:6px;border-radius:3px;background:var(--surface-2)}
.wxrange i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--sun)}
.wxtbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.wxtbl td,.wxtbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.wxtbl th{color:var(--muted);font-weight:700;font-size:12px}
.wxtbl td:first-child,.wxtbl th:first-child{text-align:left}

/* Familie: Einstellungen */
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 16px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Einkauf */
.shop-add{display:flex;gap:8px}
.shop-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
#shopBody{display:flex;flex-direction:column;gap:12px}
#shopBody h3{margin:6px 0 0}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px 10px 14px}
.item.done{background:var(--surface-2);border-color:transparent}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .txt span{font-size:13px;color:var(--muted)}
.item.done .txt b{text-decoration:line-through;color:var(--muted)}
.item.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.del{border:0;background:none;color:var(--danger);font-size:14px;font-weight:700;padding:8px 10px;border-radius:10px}
/* Rangliste */
.rank{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center}
.rank li>div{min-width:0}
.rank .pos{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.rank li:first-child .pos{color:var(--sun)}
.rank .bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.rank .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rank .pts{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.addtask{border:1.5px dashed var(--line);background:none;border-radius:16px;padding:12px;font-weight:700;color:var(--accent);width:100%}
.sheet select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;font-size:16px}
.chips.days .chip{padding:8px 12px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill.late{background:var(--danger,#d64545);color:#fff}
.tfield{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.tfield input{font-weight:500}

/* Kalender */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub{display:flex;flex-direction:column;gap:16px}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar h2{flex:1;text-align:center;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.cal button{border:0;background:none;border-radius:10px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding:0}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.cal .dots2{display:flex;gap:2px;height:5px}
.cal .dots2 i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cal button[aria-pressed="true"] .dots2 i{background:var(--accent-ink)}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 12px 14px;text-align:left;width:100%;box-sizing:border-box}
.ev .tm{flex:none;min-width:50px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.3}
.ev .tm small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:12px}
.ev .txt{flex:1;min-width:0}
.ev .txt b{display:block;font-weight:600;overflow-wrap:anywhere}
.ev .txt span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ev.bd{background:var(--sun-soft);border-color:transparent}
.ev .del{align-self:center}
.daylabel{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0}
.sheet{max-height:92vh;overflow-y:auto}
.sheet label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.sheet textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;font-size:16px;min-height:72px;resize:vertical;font-family:inherit}
.bdf{display:grid;grid-template-columns:.8fr 1.4fr 1.2fr;gap:8px;align-items:end}
.bdf label{min-width:0}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1.5fr 1.5fr 72px 1fr 1fr 1fr;align-items:end;z-index:5}

<script>
(function(){
const FAMILY=[

  {id:'fruehstueck',t:'Frühstück machen',slot:'morgens',k:'Essen',days:[0,6]},

  {id:'bella-med-abends',t:'Bella Medikamente geben',short:'Medikamente',ic:'💊',slot:'abends',k:'Bella'}
];

/* Stundenplan und Arbeitszeiten, Montag bis Freitag */
const SCHED_PEOPLE=[{n:'Jannik',kind:'work'},{n:'Linda',kind:'work'},{n:'Ringo',kind:'work'},{n:'Leni',kind:'school'}];

const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const S={wx:null,wxAt:0,wxErr:false,push:'off',pushCfg:null,bOffset:0,bella:{},sched:{},famTab:'familie',page:2,offset:0,agDays:60,agObs:null,events:[],bdays:[],bdaysLoaded:false,calTab:'termine',calMonth:null,calSel:'',done:{},muell:null,shop:[],custom:[],editTasks:false,db:null,canWrite:null,readOnlyReason:'',loading:true,q:'',editMuell:false,
  name:lsGet('frahm-name')||''};

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffDays(a,b){return Math.round((parse(key(b))-parse(key(a)))/864e5)}
function viewDate(){return addDays(today(),S.offset)}
function allTasks(){return TASKS.concat(S.custom.map(c=>{const once=/^\d{4}-\d\d-\d\d$/.test(c.once||'')?c.once:'';return {id:'c-'+c.id,t:c.t,slot:c.slot,k:once?'Einmalige Aufgabe':'Eigene Aufgabe',days:!once&&Array.isArray(c.days)&&c.days.length&&c.days.length<7?c.days:null,once,due:/^\d\d:\d\d$/.test(c.due||'')?c.due:'',who:c.who||'',custom:c.id}}))}
function tasksFor(d){const k=key(d);return allTasks().filter(t=>t.once?t.once===k:!t.days||t.days.includes(d.getDay()))}
/* Deadline passed and still open */
function isLate(d,t){if(!t.due||isDone(d,t))return false;const k=key(d),n=new Date(),nk=key(n);return k<nk||(k===nk&&String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')>t.due)}
function duePill(d,t){return t.due?'<span class="pill'+(isLate(d,t)?' late':'')+'">'+(isLate(d,t)?'Frist '+t.due+' vorbei':'bis '+t.due+' Uhr')+'</span>':''}
const WDS=['So','Mo','Di','Mi','Do','Fr','Sa'];
function daysLabel(t){if(!t.days)return '';const d=t.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7));return d.length===2&&d[0]===6&&d[1]===0?'Wochenende':d.map(i=>WDS[i]).join(', ')}
function weekStart(){const t=today();return addDays(t,-((t.getDay()+6)%7))}
/* One point per ticked task, Monday through today */
function ranking(){const from=key(weekStart()),to=key(today()),m={};Object.values(S.done).forEach(v=>{if(v.date>=from&&v.date<=to&&v.name){const n=String(v.name).trim();m[n]=(m[n]||0)+1}});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function fmtShort(d){return WD[d.getDay()].slice(0,2)+', '+d.getDate()+'. '+MO[d.getMonth()].slice(0,3)+'.'}
function relDay(n){return n===0?'Heute':n===1?'Morgen':n===-1?'Gestern':n===2?'Übermorgen':n>0?'in '+n+' Tagen':'vor '+(-n)+' Tagen'}
function relLow(n){const r=relDay(n);return /^(Heute|Morgen|Gestern|Übermorgen)$/.test(r)?r.toLowerCase():r}
function hhmm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function slotNow(){const h=new Date().getHours();return h<11?'morgens':h<16?'mittags':'abends'}

const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',

  bin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  cake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V12h16v9M2 21h20M4 16c2 1.5 4 1.5 5.3 0 1.4 1.5 4 1.5 5.4 0 1.3 1.5 3.3 1.5 5.3 0M12 12V8M12 5a1 1 0 0 1 0-2"/></svg>',
  paw:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6" r="2.2"/><circle cx="14" cy="6" r="2.2"/><circle cx="18" cy="10" r="2.2"/><path d="M12 11c-3 0-6 4.5-6 7 0 1.6 1.3 2.5 3 2.2 1.2-.2 2-.7 3-.7s1.8.5 3 .7c1.7.3 3-.6 3-2.2 0-2.5-3-7-6-7z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',

};

/* ---------- Navigation & swipe ---------- */
const track=$('#track');
function go(i){
  S.page=Math.max(0,Math.min(PAGES.length-1,i));
  track.style.transform='translateX('+(-S.page*100/PAGES.length)+'%)';
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===S.page?'page':'false'));
  document.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',j===S.page));
}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{if(+b.dataset.i===2&&S.page===2){clearSearch()}go(+b.dataset.i)}));
(function swipe(){
  const vp=$('#vp');let sx=0,sy=0,dx=0,mode=null;
  vp.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||e.target.closest('input,select,textarea,.hscroll')){mode='off';return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;mode=null;
  },{passive:true});
  vp.addEventListener('touchmove',e=>{
    if(mode==='off')return;
    const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(mode===null){if(Math.abs(x)>10&&Math.abs(x)>Math.abs(y)*1.2){mode='h';track.classList.add('drag')}else if(Math.abs(y)>10){mode='off';return}else return}
    dx=x;
    let edge=(S.page===0&&dx>0)||(S.page===PAGES.length-1&&dx<0)?0.3:1;
    track.style.transform='translateX(calc('+(-S.page*100/PAGES.length)+'% + '+(dx*edge/PAGES.length)+'px))';
  },{passive:true});
  vp.addEventListener('touchend',()=>{
    if(mode==='h'){track.classList.remove('drag');const w=vp.clientWidth;if(dx<-w*0.18)go(S.page+1);else if(dx>w*0.18)go(S.page-1);else go(S.page)}
    mode=null;
  });
  document.addEventListener('keydown',e=>{if(e.target.closest('input,select'))return;if(e.key==='ArrowRight')go(S.page+1);if(e.key==='ArrowLeft')go(S.page-1)});
})();

/* ---------- Data ---------- */
function isDone(d,t){return S.done[key(d)+'_'+t.id]}
/* Listed dates (from the AWSH calendar, holiday shifts included) win; after the last one the rhythm continues from the regular anchor date. */
function nextPickup(bin,from){
  const cfg=S.muell&&S.muell[bin.id];if(!cfg)return null;
  const dates=(Array.isArray(cfg.dates)?cfg.dates:[]).slice().sort();
  const listed=dates.find(k=>parse(k)>=from);
  if(listed)return parse(listed);
  if(!cfg.start)return null;
  const d=parse(cfg.start),step=(+cfg.weeks||bin.w)*7;
  let floor=from;const last=dates[dates.length-1];
  // half a cycle past the last listed date, so a holiday-shifted date isn't followed by its original slot
  if(last&&addDays(parse(last),Math.ceil(step/2))>floor)floor=addDays(parse(last),Math.ceil(step/2));
  if(d>=floor)return d;
  const n=Math.ceil(diffDays(d,floor)/step);return addDays(d,n*step);
}
function nextPickups(bin,from,count){
  const out=[];let f=from;
  for(let i=0;i<count;i++){const d=nextPickup(bin,f);if(!d)break;out.push(d);f=addDays(d,1)}
  return out;
}
function upcoming(){
  const t=today();
  return BINS.map(b=>({b,d:nextPickup(b,t)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
}
function nextBirthday(p){
  const t=today(),b=parse(p.b);let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());
  if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());
  return {date:n,days:diffDays(t,n),turns:n.getFullYear()-b.getFullYear()};
}
function age(p){const t=today(),b=parse(p.b);let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a}

/* ---------- Render ---------- */
S.calMonth=new Date(today().getFullYear(),today().getMonth(),1);S.calSel=key(today());

function renderHome(){
  const el=$('#p-home');
  if(S.q){el.innerHTML=renderSearch();bindSearch(el);return}
  const t=today(),list=tasksFor(t),done=list.filter(x=>isDone(t,x)).length,pct=list.length?done/list.length:0;
  const C=2*Math.PI*32;
  const hour=new Date().getHours();

/* ---------- Kalender ---------- */
const MAXY=10;
function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0}
function bdaysAll(){return S.bdaysLoaded?S.bdays:FAMILY.map(p=>({id:'f-'+p.n,name:p.n,date:p.b}))}
/* Geburtstage: date ist "JJJJ-MM-TT", "0000-MM-TT" wenn das Jahr unbekannt ist */
function bdParts(b){const a=String(b.date).split('-').map(Number);return {y:a[0]||null,m:a[1]-1,d:a[2]}}
function bdLabel(b){const p=bdParts(b);return p.d+'. '+MO[p.m]+(p.y?' '+p.y:'')}
function bdAge(b,year){const p=bdParts(b);return p.y?year-p.y:null}
function bdNext(b){const t=today(),p=bdParts(b);let day=p.d;const mk=y=>new Date(y,p.m,p.m===1&&day===29&&!isLeap(y)?28:day);let n=mk(t.getFullYear());if(n<t)n=mk(t.getFullYear()+1);return n}
function bdayOn(b,d){const p=bdParts(b);if(p.m!==d.getMonth()||(p.y&&d.getFullYear()<p.y))return false;let day=p.d;if(p.m===1&&day===29&&!isLeap(d.getFullYear()))day=28;return day===d.getDate()}
function bdFields(pre,b,dis){
  const p=b?bdParts(b):{y:null,m:-1,d:0},x=dis?' disabled':'';
  return '<div class="bdf"><label class="f">Tag<select id="'+pre+'D"'+x+'><option value="">–</option>'+Array.from({length:31},(_,i)=>'<option'+(p.d===i+1?' selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label>'+
    '<label class="f">Monat<select id="'+pre+'M"'+x+'><option value="">–</option>'+MO.map((m,i)=>'<option value="'+i+'"'+(p.m===i?' selected':'')+'>'+m+'</option>').join('')+'</select></label>'+
    '<label class="f">Jahr (optional)<input id="'+pre+'Y" inputmode="numeric" maxlength="4" placeholder="z. B. 1960" value="'+(p.y||'')+'"'+x+'></label></div>';
}
function bdRead(pre){
  const d=+$('#'+pre+'D').value,mv=$('#'+pre+'M').value,ys=$('#'+pre+'Y').value.trim();
  if(!d||mv===''){toast('Bitte Tag und Monat wählen');return null}
  const m=+mv,maxD=[31,29,31,30,31,30,31,31,30,31,30,31][m];
  if(d>maxD){toast('Den '+d+'. '+MO[m]+' gibt es nicht');return null}
  let y=0;
  if(ys){y=+ys;if(!/^\d{4}$/.test(ys)||y<1900||y>today().getFullYear()){toast('Jahr bitte vierstellig, z. B. 1960, oder leer lassen');return null}
    if(m===1&&d===29&&!isLeap(y)){toast(y+' hatte keinen 29. Februar');return null}}
  return String(y).padStart(4,'0')+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function itemsOn(d){
  const k=key(d),out=[];
  S.events.filter(e=>e.date===k).forEach(e=>out.push({kind:'ev',e,time:e.time||''}));
  bdaysAll().filter(b=>bdayOn(b,d)).forEach(b=>out.push({kind:'bd',b,time:'',age:bdAge(b,d.getFullYear())}));
  BINS.forEach(bin=>{const p=nextPickup(bin,d);if(p&&key(p)===k)out.push({kind:'muell',bin,time:''})});
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function longDate(d){return WD[d.getDay()]+', '+d.getDate()+'. '+MO[d.getMonth()]+' '+d.getFullYear()}
function evRow(it){
  if(it.kind==='ev'){const e=it.e;return '<button class="ev" data-ev="'+esc(e.id)+'"><span class="tm">'+(e.time?esc(e.time):'<small>ganztägig</small>')+'</span><span class="txt"><b>'+esc(e.title)+'</b>'+(e.place?'<span>Ort: '+esc(e.place)+'</span>':'')+(e.persons&&e.persons.length?'<span>Mit: '+esc(e.persons.join(', '))+'</span>':'')+'</span></button>'}
  if(it.kind==='bd')return '<button class="ev bd" data-bd="'+esc(it.b.id)+'"><span class="tm">🎂</span><span class="txt"><b>'+esc(it.b.name)+' hat Geburtstag</b>'+(it.age>0?'<span>wird '+it.age+'</span>':'')+'</span></button>';
  return '<button class="ev" data-muell="1"><span class="tm"><span class="can" style="--c:'+it.bin.c+';width:18px;height:22px;display:block;margin:4px 0 0 6px"></span></span><span class="txt"><b>'+it.bin.n+'</b><span>Müllabfuhr · Tonne am Vorabend rausstellen</span></span></button>';
}

function renderTermine(){

/* Tagesliste ab heute, lädt beim Scrollen weitere Tage nach (bis 10 Jahre) */
function renderAgenda(){
  const box=$('#agenda'),more=$('#agMore');if(!box)return;
  const t=today(),cap=diffDays(t,new Date(t.getFullYear()+MAXY,t.getMonth()+1,0));
  const n=Math.min(S.agDays,cap);let html='',lastWeek=null;
  for(let i=0;i<=n;i++){
    const d=addDays(t,i),its=itemsOn(d);
    if(!its.length&&i>0)continue;
    const w=isoWeek(d);
    if(w!==lastWeek&&lastWeek!==null)html+='<p class="agweek">KW '+w+(d.getFullYear()!==t.getFullYear()?' · '+d.getFullYear():'')+'</p>';
    lastWeek=w;
    html+='<div class="agday'+(i===0?' is-today':'')+'"><div class="agdate"><small>'+WD[d.getDay()].slice(0,2)+'.</small><b>'+d.getDate()+'</b>'+'<small class="agmon">'+(MO[d.getMonth()].length>4?MO[d.getMonth()].slice(0,3).toLowerCase()+'.':MO[d.getMonth()].toLowerCase())+'</small>'+'</div><div class="agitems">'+(its.length?its.map(agBlock).join(''):'<div class="agb empty" style="--c:var(--line)"><span>Heute nichts eingetragen</span></div>')+'</div></div>';
  }
  box.innerHTML=html;
  bindItems(box);
  const done=n>=cap;
  more.textContent=done?'Ende der Liste: 10 Jahre im Voraus':'Weitere Tage werden geladen …';
  if(S.agObs)S.agObs.disconnect();S.agObs=null;
  if(!done&&'IntersectionObserver' in window){
    S.agObs=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){S.agObs.disconnect();S.agDays+=90;renderAgenda()}},{rootMargin:'400px'});
    S.agObs.observe(more);
  }
}

/* ---------- Zeiten: Stundenplan & Arbeitszeiten ---------- */
const WDN=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function nowHM(d){d=d||new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function shortT(t){return t?t.replace(/^0/,'').replace(/:00$/,''):''}
function schedDay(n,wd){const s=S.sched[n];return s&&s.days&&s.days[wd]||null}
function personColor(n){const p=FAMILY.find(x=>x.n===n);return p?p.c:'var(--muted)'}
/* Wo ist jemand zu einem Zeitpunkt? home: true = zuhause, false = unterwegs, null = unbekannt */
function whereIs(n,at){
  at=at||new Date();const wd=at.getDay(),pp=SCHED_PEOPLE.find(x=>x.n===n),school=pp&&pp.kind==='school';
  if(wd===0||wd===6)return {home:true,txt:'Wochenende'};
  const d=schedDay(n,wd);
  if(!d||(!d.off&&(!d.from||!d.to)))return {home:null,txt:'Keine Zeiten eingetragen'};
  if(d.off)return {home:true,txt:'Heute frei'};
  const m=nowHM(at);
  if(d.ho)return m>=d.from&&m<d.to?{home:true,ho:true,txt:'Homeoffice bis '+shortT(d.to)+' Uhr'}:{home:true,txt:m<d.from?'Homeoffice ab '+shortT(d.from)+' Uhr':'Feierabend'};
  if(m<d.from)return {home:true,txt:(school?'Schule':'Arbeit')+' ab '+shortT(d.from)+' Uhr'};
  if(m<d.to)return {home:false,txt:(school?'In der Schule':'Auf der Arbeit')+' bis '+shortT(d.to)+' Uhr'};
  return {home:true,txt:school?'Schule ist vorbei':'Feierabend'};
}
function homeSummary(){
  const st=SCHED_PEOPLE.map(p=>({n:p.n,w:whereIs(p.n)}));
  if(st.every(x=>x.w.home===null))return 'Zeiten eintragen';
  const h=st.filter(x=>x.w.home).map(x=>x.n);
  return h.length===st.length?'Alle zuhause':h.length?'Zuhause: '+h.join(', '):'Gerade niemand';
}

/* ---------- Frag Frahm: Assistent, läuft komplett im Handy ----------

   Aufgaben, Bella und Einkauf, und kann Termine eintragen. */
const AI_WD={sonntag:0,montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6};
const AI_MON={januar:0,februar:1,'märz':2,maerz:2,april:3,mai:4,juni:5,juli:6,august:7,september:8,oktober:9,november:10,dezember:11,jan:0,feb:1,apr:3,jun:5,jul:6,aug:7,sep:8,sept:8,okt:9,nov:10,dez:11};
const AI_MONRE='(januar|februar|märz|maerz|april|mai|juni|juli|august|september|oktober|november|dezember|jan|feb|apr|jun|jul|aug|sept|sep|okt|nov|dez)';
const HUMANS=()=>FAMILY.filter(p=>!p.dog).map(p=>p.n);
function aiFmt(d){return WDS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'}
function aiYear(m,d){const t=today();let y=t.getFullYear();if(new Date(y,m,d)<t)y++;return y}
/* Findet das erste Datum im Text. Gibt {d, i, len} zurück. */
function aiDate(str){
  const t=today(),c=[];let m;
  const add=(re,fn)=>{re.lastIndex=0;const x=re.exec(str);if(x){const d=fn(x);if(d&&!isNaN(d))c.push({d,i:x.index,len:x[0].length})}};
  add(/\bübermorgen\b/i,()=>addDays(t,2));
  add(/(?<!über)\bmorgen\b(?!s)/i,()=>addDays(t,1));
  add(/\bheute\b/i,()=>t);
  add(/\bin\s+(\d+|einem|zwei|drei)\s+tag(en)?\b/i,x=>addDays(t,{einem:1,zwei:2,drei:3}[x[1].toLowerCase()]||+x[1]));
  add(/\bin\s+(einer|\d+|zwei)\s+woche(n)?\b/i,x=>addDays(t,7*({einer:1,zwei:2}[x[1].toLowerCase()]||+x[1])));
  add(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/,x=>{const y=x[3]?(x[3].length===2?2000+ +x[3]:+x[3]):aiYear(+x[2]-1,+x[1]);const d=new Date(y,+x[2]-1,+x[1]);return d.getMonth()===+x[2]-1?d:null});
  add(new RegExp('\\b(\\d{1,2})\\.?\\s*'+AI_MONRE+'\\b\\.?(\\s+(\\d{4}))?','i'),x=>{const mo=AI_MON[x[2].toLowerCase()];const y=x[4]?+x[4]:aiYear(mo,+x[1]);return new Date(y,mo,+x[1])});
  add(/\b(?:am\s+)?(nächsten|nächster|kommenden|diesen|übernächsten)?\s*(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/i,x=>{const wd=AI_WD[x[2].toLowerCase()],pre=(x[1]||'').toLowerCase();let n=(wd-t.getDay()+7)%7;if(pre.startsWith('nächst')&&n===0)n=7;if(pre==='übernächsten')n+=7;return addDays(t,n)});
  c.sort((a,b)=>a.i-b.i);return c[0]||null;
}
/* Zeitraum für Fragen wie „nächste Woche“, „im November“, „zwischen 1.11. und 10.11.“ */
function aiRange(str){
  const t=today(),l=str.toLowerCase();let m;
  if((m=/(?:zwischen|vom|von)\s+(.+?)\s+(?:und|bis)\s+(.+)$/i.exec(str))){const a=aiDate(m[1]),b=aiDate(m[2]);if(a&&b&&b.d>=a.d)return {from:a.d,to:b.d,label:'vom '+aiFmt(a.d)+' bis '+aiFmt(b.d)}}
  if((m=/\bbis\s+(.+)$/i.exec(str))){const b=aiDate(m[1]);if(b&&b.d>=t)return {from:t,to:b.d,label:'bis '+aiFmt(b.d)}}
  if(/übernächste[nr]?\s+woche/.test(l)){const mo=addDays(t,((8-t.getDay())%7||7)+7);return {from:mo,to:addDays(mo,6),label:'übernächste Woche'}}
  if(/nächste[nr]?\s+woche|kommende[nr]?\s+woche/.test(l)){const mo=addDays(t,(8-t.getDay())%7||7);return {from:mo,to:addDays(mo,6),label:'nächste Woche'}}
  if(/diese[rn]?\s+woche|die\s+woche\b/.test(l)){return {from:t,to:addDays(t,(7-t.getDay())%7),label:'diese Woche'}}
  if(/wochenende/.test(l)){const wd=t.getDay();let sat=wd===6?t:wd===0?addDays(t,-1):addDays(t,6-wd);if(/nächste[sn]?\s+wochenende/.test(l)&&(wd===6||wd===0))sat=addDays(sat,7);const from=sat<t?t:sat;return {from,to:addDays(sat,1),label:(from.getTime()===t.getTime()?'dieses':'am')+' Wochenende'}}
  if((m=/(?:die\s+)?nächsten\s+(\d+)\s+tage/.exec(l)))return {from:t,to:addDays(t,+m[1]-1),label:'die nächsten '+m[1]+' Tage'};
  if((m=/(?:die\s+)?nächsten\s+(\d+)\s+wochen/.exec(l)))return {from:t,to:addDays(t,7*m[1]-1),label:'die nächsten '+m[1]+' Wochen'};
  if(/diese[nm]?\s+monat/.test(l))return {from:t,to:new Date(t.getFullYear(),t.getMonth()+1,0),label:'diesen Monat'};
  if(/nächste[nm]?\s+monat/.test(l)){const a=new Date(t.getFullYear(),t.getMonth()+1,1);return {from:a,to:new Date(a.getFullYear(),a.getMonth()+1,0),label:MO[a.getMonth()]}}
  if((m=new RegExp('\\b(?:im|in|ende|anfang)?\\s*'+AI_MONRE+'\\b(?!\\s*\\d)','i').exec(str))&&!/\d\.?\s*$/.test(str.slice(0,m.index))){const mo=AI_MON[m[1].toLowerCase()];let y=t.getFullYear();if(mo<t.getMonth())y++;let a=new Date(y,mo,1);if(a<t)a=t;return {from:a,to:new Date(y,mo+1,0),label:'im '+MO[mo]}}
  const d=aiDate(str);if(d)return {from:d.d,to:d.d,label:d.d.getTime()===t.getTime()?'heute':d.d.getTime()===addDays(t,1).getTime()?'morgen':'am '+aiFmt(d.d),single:true};
  return null;
}
function aiTime(str){
  let m;
  if((m=/\bhalb\s+(\d{1,2})\b/i.exec(str))){const h=(+m[1]+23)%24;return {v:String(h).padStart(2,'0')+':30',i:m.index,len:m[0].length}}
  if((m=/\b(?:um\s*)?([01]?\d|2[0-3])[:.]([0-5]\d)\s*(?:uhr)?(?![.\d])/i.exec(str)))return {v:m[1].padStart(2,'0')+':'+m[2],i:m.index,len:m[0].length};
  if((m=/\b(?:um|ab|gegen)\s*([01]?\d|2[0-3])\s*(?:uhr)?\b/i.exec(str))||(m=/\b([01]?\d|2[0-3])\s*uhr\b/i.exec(str)))return {v:m[1].padStart(2,'0')+':00',i:m.index,len:m[0].length};
  return null;
}
function aiPersons(str){
  const l=str.toLowerCase(),out=HUMANS().filter(n=>new RegExp('\\b'+n.toLowerCase()+'\\b').test(l));
  if(/\b(ich|mich|mir|mein)\b/.test(l)&&S.name&&!out.includes(S.name))out.push(S.name);
  return out;
}
const hm2m=t=>{const [h,m]=t.split(':').map(Number);return h*60+m},m2hm=v=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
/* Freie Zeitfenster eines Tages zwischen 8 und 21 Uhr, für die genannten Personen */
function aiFree(d,persons){
  const k=key(d),busy=[],notes=[];
  S.events.filter(e=>e.date===k&&(!e.persons||!e.persons.length||e.persons.some(p=>persons.includes(p)))).forEach(e=>{if(e.time){const a=hm2m(e.time);busy.push([a,a+90,e.title])}else notes.push(e.title)});
  const wd=d.getDay();
  if(wd>=1&&wd<=5)persons.forEach(n=>{const x=schedDay(n,wd);if(x&&!x.off&&x.from&&x.to)busy.push([hm2m(x.from),hm2m(x.to),n+(SCHED_PEOPLE.find(p=>p.n===n&&p.kind==='school')?' Schule':' Arbeit')])});
  busy.sort((a,b)=>a[0]-b[0]);
  const free=[];let cur=8*60;
  if(k===key(today())){const n=new Date();cur=Math.max(cur,Math.ceil((n.getHours()*60+n.getMinutes())/30)*30)}
  busy.forEach(b=>{if(b[0]>cur)free.push([cur,Math.min(b[0],21*60)]);cur=Math.max(cur,b[1])});
  if(cur<21*60)free.push([cur,21*60]);
  return {free:free.filter(f=>f[1]-f[0]>=60),busy,notes};
}
function aiFreeLabel(f){
  if(f.length===1&&f[0][0]===480&&f[0][1]===1260)return 'ganzer Tag frei';
  return f.map(x=>x[1]===1260?'ab '+shortT(m2hm(x[0]))+' Uhr':shortT(m2hm(x[0]))+'–'+shortT(m2hm(x[1]))+' Uhr').join(', ');
}
function aiAddBtn(k,time,label){return '<button class="aibtn" data-ai-new="'+k+'"'+(time?' data-ai-time="'+time+'"':'')+'>'+(label||'+ Termin')+'</button>'}
function assist(q){
  const l=q.toLowerCase().trim();if(l.length<3)return null;
  const t=today();
  /* Termin eintragen */
  if(/^(bitte\s+)?(trag|trage|eintragen|neuer termin|neuen termin|termin\s*:|erstell|erstelle|plane?|leg|lege|füg|füge|merk)/.test(l)||/\b(eintragen|einplanen)\b/.test(l)){
    let rest=q.replace(/^(bitte\s+)?(trag(e)?|neue[rn]? termin|termin\s*:|erstell(e)?|plan(e)?|leg(e)?|füg(e)?|merk(e)?(\s+dir)?)\s*(mal\s+)?(bitte\s+)?(einen\s+|ein\s+|den\s+|die\s+)?(termin\s+)?/i,'').replace(/\s+(ein|eintragen|einplanen|an|hinzu|bitte|in den kalender|im kalender)\s*[.!]?\s*$/i,'');
    const dt=aiDate(rest);if(dt)rest=rest.slice(0,dt.i)+' '+rest.slice(dt.i+dt.len);
    const tm=aiTime(rest);if(tm)rest=rest.slice(0,tm.i)+' '+rest.slice(tm.i+tm.len);
    const persons=aiPersons(rest);
    rest=rest.replace(/\b(mit|für)\s+((?:[A-ZÄÖÜa-zäöü]+)(?:\s*(?:,|und)\s*[A-ZÄÖÜa-zäöü]+)*)/gi,(all,w,names)=>names.split(/\s*(?:,|und)\s*/).every(x=>HUMANS().some(n=>n.toLowerCase()===x.toLowerCase())||/^(mir|mich|uns|allen)$/i.test(x))?' ':all);
    let place='';const pm=/\b(?:in|bei|im|beim)\s+((?:der\s+|dem\s+)?[A-ZÄÖÜ][\wäöüß\-]*(?:\s+[A-ZÄÖÜ][\wäöüß\-]*)*)/.exec(rest);
    if(pm){place=pm[1].replace(/^(der|dem)\s+/,'');rest=rest.slice(0,pm.index)+' '+rest.slice(pm.index+pm[0].length)}
    let title=rest.replace(/\b(am|um|ab|einen|ein|eine|termin|uhr)\b/gi,' ').replace(/[,.!]+/g,' ').replace(/\s+/g,' ').trim();
    if(title)title=title[0].toUpperCase()+title.slice(1);
    const draft={title,place,date:dt?key(dt.d):'',time:tm?tm.v:'',persons};S.aiDraft=draft;
    const ok=title&&draft.date;
    return '<p>'+(ok?'So würde ich den Termin eintragen:':'Fast, mir fehlt noch '+(!title?'der Titel':'das Datum')+'.')+'</p><ul class="ailist"><li><span><b>'+esc(title||'Ohne Titel')+'</b><small>'+(draft.date?WD[parse(draft.date).getDay()]+', '+parse(draft.date).getDate()+'. '+MO[parse(draft.date).getMonth()]:'Datum fehlt')+(draft.time?' · '+draft.time+' Uhr':' · ganztägig')+(place?' · '+esc(place):'')+(persons.length?' · mit '+esc(persons.join(', ')):'')+'</small></span></li></ul><div class="row" style="margin-top:10px">'+(ok&&S.canWrite?'<button class="aibtn" data-ai-save>Eintragen</button>':'')+'<button class="aibtn ghost" data-ai-edit>'+(ok?'Vorher ändern':'Ergänzen')+'</button></div>';
  }
  /* Freie Zeit */
  if(/\b(zeit|frei|freie|verfügbar|passt|lücke|kann man|können wir)\b/.test(l)&&!/wetter/.test(l)){
    const r=aiRange(q)||{from:t,to:addDays(t,6),label:'die nächsten 7 Tage'};
    let persons=aiPersons(q);if(!persons.length)persons=HUMANS();
    const tm=aiTime(q),days=[];
    for(let d=new Date(r.from);d<=r.to&&days.length<62;d=addDays(d,1))if(d>=t)days.push(new Date(d));
    let res=days.map(d=>({d,...aiFree(d,persons)}));
    if(tm){const v=hm2m(tm.v);res=res.filter(x=>x.free.some(f=>f[0]<=v&&f[1]>=v+60))}
    else res=res.filter(x=>x.free.length);
    const missing=persons.filter(n=>!S.sched[n]);
    const who=persons.length===HUMANS().length?'alle':persons.join(' & ');
    if(!res.length)return '<p>'+r.label[0].toUpperCase()+r.label.slice(1)+' finde ich leider keine freie Zeit für '+esc(who)+(tm?' um '+tm.v+' Uhr':'')+'.</p>';
    const shown=res.slice(0,10);
    return '<p>Frei für '+esc(who)+' · '+esc(r.label)+(tm?' um '+shortT(tm.v)+' Uhr':'')+':</p><ul class="ailist">'+shown.map(x=>{const st=tm?tm.v:(x.free[0][0]===480?'':m2hm(x.free[0][0]));return '<li><span><b>'+aiFmt(x.d)+'</b><small>'+(tm?'um '+shortT(tm.v)+' Uhr frei':aiFreeLabel(x.free))+(x.notes.length?' · '+esc(x.notes.join(', ')):'')+'</small></span>'+(S.canWrite?aiAddBtn(key(x.d),st):'')+'</li>'}).join('')+'</ul>'+(res.length>shown.length?'<p class="small muted" style="margin-top:8px">… und '+(res.length-shown.length)+' weitere Tage.</p>':'')+(missing.length?'<p class="small muted" style="margin-top:8px">Für '+esc(missing.join(', '))+' sind noch keine Arbeits- oder Schulzeiten eingetragen, da zählen nur die Termine.</p>':'');
  }
  /* Wetter */
  if(/wetter|regen|regnet|schirm|warm|kalt|temperatur|grad|sonne|schnee|gewitter|wind/.test(l)){
    if(!S.wx)return '<p>Das Wetter ist gerade nicht geladen. Bitte gleich nochmal versuchen.</p>';
    const dt=aiDate(q),d=dt?dt.d:t,di=diffDays(t,d),w=S.wx;
    if(di<0||di>6)return '<p>Die Vorhersage reicht nur 7 Tage weit.</p>';
    const h=w.hourly,i0=di*24+(di===0?new Date().getHours():0),idx=[];for(let i=i0;i<(di+1)*24&&i<h.time.length;i++)idx.push(i);
    const [em,tx]=wmo(w.daily.weather_code[di],1),rp=Math.max(0,...idx.map(i=>h.precipitation_probability[i]||0));
    const wet=idx.filter(i=>(h.precipitation_probability[i]||0)>=50).map(i=>+h.time[i].slice(11,13));
    const ranges=[];wet.forEach(x=>{const r=ranges[ranges.length-1];if(r&&r[1]===x-1)r[1]=x;else ranges.push([x,x])});
    const lbl=di===0?'Heute':di===1?'Morgen':WD[d.getDay()];
    let ans='<p><b>'+lbl+' in Todendorf:</b> '+em+' '+tx+', '+Math.round(w.daily.temperature_2m_min[di])+'° bis '+Math.round(w.daily.temperature_2m_max[di])+'°.</p>';
    if(/regen|regnet|schirm|nass/.test(l))ans+='<p>'+(rp>=60?'Ja, Regen ist ziemlich wahrscheinlich ('+rp+' %).':rp>=30?'Vielleicht, die Regenwahrscheinlichkeit liegt bei bis zu '+rp+' %.':'Eher nicht, höchstens '+rp+' % Regenwahrscheinlichkeit.')+(ranges.length?' Am ehesten '+ranges.map(r=>r[0]===r[1]?'um '+r[0]+' Uhr':'zwischen '+r[0]+' und '+(r[1]+1)+' Uhr').join(' und ')+'.':'')+(rp>=40?' Schirm einpacken! ☂️':'')+'</p>';
    else ans+='<p>Regen bis '+rp+' %'+(ranges.length?', am ehesten '+ranges.map(r=>r[0]===r[1]?'um '+r[0]+' Uhr':r[0]+'–'+(r[1]+1)+' Uhr').join(', '):'')+'.</p>';
    return ans+'<button class="aibtn ghost" data-ai-wx>Stunde für Stunde ansehen</button>';
  }
  /* Müll */
  if(/müll|tonne|abfuhr|gelbe|gelber sack|papier|bio|restmüll|restabfall/.test(l)){
    const pick=/gelb|wertstoff/.test(l)?'gelb':/bio|braun/.test(l)?'bio':/papier|blau/.test(l)?'papier':/rest|grau|schwarz/.test(l)?'rest':'';
    const list=BINS.filter(b=>!pick||b.id===pick).map(b=>({b,d:nextPickup(b,t)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);

  }

  if(/punkte|führt|rangliste|gewinnt|wer hat am meisten/.test(l)){

  }
  /* Einkauf */
  if(/einkauf|einkaufen|kaufen|fehlt|einkaufsliste/.test(l)){
    const open=S.shop.filter(x=>!x.done);
    return open.length?'<p>Auf der Einkaufsliste '+(open.length===1?'steht':'stehen')+' '+open.length+':</p><p>'+open.map(x=>esc(x.text)).join(', ')+'</p>':'<p>Die Einkaufsliste ist leer.</p>';
  }
  /* Aufgaben */
  if(/aufgabe|zu tun|erledigen|offen|was muss/.test(l)){

  }
  /* Termine / was steht an */
  if(/termin|steht|was ist|was haben|was gibt|kalender|programm|vorhaben|los\b|an\?$|plan/.test(l)||aiRange(q)){
    const r=aiRange(q)||{from:t,to:addDays(t,1),label:'heute und morgen'};
    const persons=aiPersons(q),rows=[];
    for(let d=new Date(r.from);d<=r.to&&rows.length<40;d=addDays(d,1)){itemsOn(d).forEach(it=>{if(persons.length&&it.kind==='ev'&&it.e.persons&&it.e.persons.length&&!it.e.persons.some(p=>persons.includes(p)))return;rows.push({d:new Date(d),it})})}
    if(!rows.length)return '<p>'+r.label[0].toUpperCase()+r.label.slice(1)+' steht nichts im Kalender.</p>'+(S.canWrite&&r.single?aiAddBtn(key(r.from),'','+ Termin eintragen'):'');
    return '<p>'+esc(r.label[0].toUpperCase()+r.label.slice(1))+':</p><ul class="ailist">'+rows.map(x=>{const it=x.it;const title=it.kind==='ev'?it.e.title:it.kind==='bd'?'🎂 '+it.b.name+(it.age?' wird '+it.age:''):'🗑️ '+it.bin.n;const sub=aiFmt(x.d)+(it.kind==='ev'&&it.e.time?' · '+it.e.time+' Uhr':'')+(it.kind==='ev'&&it.e.place?' · '+it.e.place:'')+(it.kind==='ev'&&it.e.persons&&it.e.persons.length?' · '+it.e.persons.join(', '):'');return '<li><span><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></span></li>'}).join('')+'</ul>';
  }
  return null;
}

const ASK_EXAMPLES=['Wann haben wir nächste Woche Zeit?','Regnet es morgen?','Wer ist gerade zuhause?','Was steht diese Woche an?','Trag Zahnarzt am Freitag um 15 Uhr ein','Wann kommt die gelbe Tonne?'];

/* ---------- Wetter (Open-Meteo, ohne Schlüssel) ---------- */
const WX_URL='https://api.open-meteo.com/v1/forecast?latitude=53.6927&longitude=10.3466&timezone=Europe%2FBerlin&forecast_days=7'+
  '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation,is_day'+
  '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,is_day'+
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset';
function wmo(c,day){
  c=+c;const n=day===0;
  if(c===0)return [n?'🌙':'☀️','Klar'];
  if(c===1)return [n?'🌙':'🌤️','Überwiegend klar'];
  if(c===2)return [n?'☁️':'⛅','Teilweise bewölkt'];
  if(c===3)return ['☁️','Bedeckt'];
  if(c===45||c===48)return ['🌫️','Nebel'];
  if(c>=51&&c<=55)return ['🌦️','Nieselregen'];
  if(c===56||c===57)return ['🌧️','Gefrierender Niesel'];
  if(c===61)return ['🌦️','Leichter Regen'];
  if(c===63)return ['🌧️','Regen'];
  if(c===65)return ['🌧️','Starker Regen'];
  if(c===66||c===67)return ['🌧️','Gefrierender Regen'];
  if(c>=71&&c<=77)return ['🌨️','Schnee'];
  if(c>=80&&c<=82)return ['🌦️','Regenschauer'];
  if(c===85||c===86)return ['🌨️','Schneeschauer'];
  if(c>=95)return ['⛈️','Gewitter'];
  return ['🌡️','Wetter'];
}

async function fetchWeather(force){
  if(!force&&S.wx&&Date.now()-(S.wxAt||0)<30*6e4)return;
  try{const r=await fetch(WX_URL);if(!r.ok)throw new Error(r.status);const d=await r.json();if(!d.hourly||!d.daily)throw new Error('data');
    S.wx=d;S.wxAt=Date.now();S.wxErr=false;lsSet('frahm-wx',JSON.stringify({at:S.wxAt,data:d}))}

  if(!S.q)renderHome();
}

/* Zwei Diagramme mit je eigener Achse: Temperatur als Linie, Regenwahrscheinlichkeit als Balken */
function wxCharts(day,sel){
  const h=S.wx.hourly,start=day*24,idx=[...Array(24).keys()].map(i=>start+i).filter(i=>i<h.time.length);
  const W=340,L=28,Rt=8,cw=(W-L-Rt)/24,x=j=>L+cw*j+cw/2;
  const temps=idx.map(i=>h.temperature_2m[i]),lo=Math.floor(Math.min(...temps))-1,hi=Math.ceil(Math.max(...temps))+1,TH=120,tY=v=>10+(hi-v)/(hi-lo)*(TH-30);
  let t='<svg class="wxchart" viewBox="0 0 '+W+' '+TH+'" role="img" aria-label="Temperatur pro Stunde">';
  [hi,Math.round((hi+lo)/2),lo].forEach(v=>{t+='<line x1="'+L+'" x2="'+(W-Rt)+'" y1="'+tY(v)+'" y2="'+tY(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(tY(v)+3)+'" text-anchor="end">'+v+'°</text>'});
  t+='<path d="'+temps.map((v,j)=>(j?'L':'M')+x(j).toFixed(1)+' '+tY(v).toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  if(sel!=null&&temps[sel]!=null)t+='<line x1="'+x(sel)+'" x2="'+x(sel)+'" y1="6" y2="'+(TH-18)+'" stroke="var(--muted)" stroke-dasharray="3 3"/><circle cx="'+x(sel)+'" cy="'+tY(temps[sel])+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  [0,3,6,9,12,15,18,21].forEach(j=>{t+='<text x="'+x(j)+'" y="'+(TH-4)+'" text-anchor="middle">'+j+'</text>'});
  idx.forEach((i,j)=>{t+='<rect data-hr="'+j+'" x="'+(L+cw*j)+'" y="0" width="'+cw+'" height="'+TH+'" fill="transparent"/>'});
  t+='</svg>';
  const RH=90,rY=v=>8+(100-v)/100*(RH-26);
  let r='<svg class="wxchart" viewBox="0 0 '+W+' '+RH+'" role="img" aria-label="Regenwahrscheinlichkeit pro Stunde">';
  [100,50,0].forEach(v=>{r+='<line x1="'+L+'" x2="'+(W-Rt)+'" y1="'+rY(v)+'" y2="'+rY(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(rY(v)+3)+'" text-anchor="end">'+v+'%</text>'});
  idx.forEach((i,j)=>{const v=h.precipitation_probability[i]||0;if(v>0){const y=rY(v),bw=cw-2;r+='<path d="M'+(L+cw*j+1)+' '+rY(0)+'V'+(y+Math.min(4,rY(0)-y))+'q0 -4 4 -4h'+(bw-8)+'q4 0 4 4V'+rY(0)+'Z" fill="var(--papier)"'+(sel!=null&&sel!==j?' opacity=".45"':'')+'/>'}});
  [0,3,6,9,12,15,18,21].forEach(j=>{r+='<text x="'+x(j)+'" y="'+(RH-4)+'" text-anchor="middle">'+j+'</text>'});
  idx.forEach((i,j)=>{r+='<rect data-hr="'+j+'" x="'+(L+cw*j)+'" y="0" width="'+cw+'" height="'+RH+'" fill="transparent"/>'});
  r+='</svg>';
  return {t,r,idx};
}

    $('#cancel').onclick=()=>{host.innerHTML=''};
    $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')host.innerHTML=''});

/* ---------- Push-Nachrichten ----------
   Das Handy meldet sich hier an; der GitHub-Dienst (.github/push/send.mjs) schickt die Nachrichten.
   Das Schlüsselpaar entsteht einmalig hier im Browser: der öffentliche Teil kommt nach config/push,
   der geheime nur in das GitHub-Secret PUSH_GEHEIM. */
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function pushId(ep){let h=2166136261;for(let i=0;i<ep.length;i++){h^=ep.charCodeAt(i);h=Math.imul(h,16777619)}return 'p'+(h>>>0).toString(36)+ep.length.toString(36)}
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function pushCard(){
  let body;
  if(S.pushCfg===null&&S.canWrite)body='<p class="small muted" style="margin:0">Wird geladen …</p>';
  else if(!S.pushCfg||!S.pushCfg.vapidPublic)body='<button class="btn" id="pushSetup"'+(S.canWrite?'':' disabled')+'>Einmal einrichten</button>';
  else if(S.push==='on')body='<p class="small muted" style="margin:0 0 10px">An'+(S.name?' für '+esc(S.name):'')+'</p><button class="btn ghost" id="pushOff">Ausschalten</button>';
  else if(!pushSupported())body='<p class="small muted" style="margin:0">'+(isIOS()&&!isStandalone()?'Nur in der App vom Home-Bildschirm.':'Hier nicht möglich.')+'</p>';
  else if(Notification.permission==='denied')body='<p class="small muted" style="margin:0">In den Handy-Einstellungen blockiert.</p>';
  else body='<button class="btn" id="pushOn"'+(S.canWrite?'':' disabled')+'>Benachrichtigungen erlauben</button>';
  return '<div class="card"><h3>Push-Nachrichten</h3>'+body+'</div>';
}
async function pushReg(){return navigator.serviceWorker.ready}
async function pushSave(){
  try{const r=await pushReg(),sub=await r.pushManager.getSubscription();if(!sub||!S.db)return false;
    const j=sub.toJSON();await S.db.collection('push').doc(pushId(j.endpoint)).set({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,name:S.name||'',ua:navigator.userAgent.slice(0,120),at:Date.now()});return true}catch(e){handleWriteError(e);return false}
}
async function pushEnable(){
  const b=$('#pushOn');if(b){b.disabled=true;b.textContent='Einen Moment …'}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Nachrichten wurden nicht erlaubt');S.push='off';renderFamily();return}
    const r=await pushReg();
    let sub=await r.pushManager.getSubscription();
    if(!sub)sub=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(S.pushCfg.vapidPublic)});
    S.push='on';
    if(await pushSave()){toast('Push-Nachrichten sind an');r.showNotification('Frahm',{body:'So sehen die Nachrichten aus. 👍',icon:'icon-192.png',tag:'frahm-test'})}
  }catch(e){toast('Hat nicht geklappt, bitte nochmal versuchen');S.push='off'}
  renderFamily();
}
async function pushDisable(){
  try{const r=await pushReg(),sub=await r.pushManager.getSubscription();if(sub){const id=pushId(sub.endpoint);await sub.unsubscribe();if(S.db)await S.db.collection('push').doc(id).delete()}}catch(e){}
  S.push='off';renderFamily();toast('Push-Nachrichten sind aus');
}
function b64e(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function pushSetup(){
  let pub,priv;
  try{const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']);
    pub=b64e(await crypto.subtle.exportKey('raw',k.publicKey));priv=(await crypto.subtle.exportKey('jwk',k.privateKey)).d}catch(e){toast('Dieser Browser kann das leider nicht');return}
  const secret=(lsGet('frahm-code')||'')+'|'+priv;
  const host=$('#sheetHost');
  host.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Push einrichten"><h2 style="font-size:20px">Push einrichten</h2>'+
    '<textarea id="pSecret" readonly rows="3" style="width:100%;box-sizing:border-box;font:13px ui-monospace,monospace;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)">'+esc(secret)+'</textarea><button class="btn ghost" type="button" id="pCopy">Kopieren</button>'+
    '<a class="btn ghost" href="https://github.com/jannikfrahm1-design/Frahm/settings/secrets/actions/new" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">GitHub öffnen</a>'+
    '<div class="row"><button class="btn" type="button" id="pDone" style="flex:1">In GitHub gespeichert</button><button class="btn ghost" type="button" id="cancel">Abbrechen</button></div></div></div>';
  const close=()=>{host.innerHTML=''};
  $('#cancel').onclick=close;
  $('#pCopy').onclick=async()=>{try{await navigator.clipboard.writeText(secret);toast('Kopiert')}catch(e){const t=$('#pSecret');t.focus();t.select();toast('Text markiert, jetzt kopieren')}};
  $('#pDone').onclick=async()=>{try{await S.db.collection('config').doc('push').set({vapidPublic:pub,at:Date.now(),by:S.name||''});close();toast('Eingerichtet! Jetzt Benachrichtigungen erlauben')}catch(e){handleWriteError(e)}};
}
async function pushInit(){
  if(!S.pushCfg||!S.pushCfg.vapidPublic||!pushSupported()||Notification.permission!=='granted')return;
  try{const r=await pushReg(),sub=await r.pushManager.getSubscription();if(sub&&S.push!=='on'){S.push='on';renderFamily();pushSave()}}catch(e){}
}

  },fail));
  unsubs.push(base.collection('shopping').onSnapshot(snap=>{
    S.shop=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x.text);renderShop();renderHome();
  },fail));
  unsubs.push(base.collection('tasks').onSnapshot(snap=>{
    S.custom=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(c=>c.t&&SLOTS.some(x=>x[0]===c.slot)).sort((a,b)=>(a.at||0)-(b.at||0));renderTasks();renderHome();
  },fail));
}
connect();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
