        await S.db.collection('packages').doc(p.id).update(ch);toast('Gespeichert');
      }
    }catch(err){handleWriteError(err)}
  });
}
async function togglePkg(id){
  const p=S.pkgs.find(x=>x.id===id);if(!p)return;
  const da=pkgState(p)==='da';
  try{await S.db.collection('packages').doc(id).update(da?{status:'unterwegs',statusAt:Date.now(),statusBy:S.name||'',receivedBy:'',receivedAt:0}:{status:'da',receivedBy:S.name||'',receivedAt:Date.now()});toast(da?'Wieder unterwegs':'Paket ist da'+(p.for&&p.for!==S.name?', '+p.for+' bekommt Bescheid':''))}catch(e){handleWriteError(e)}
}
async function togglePkgToday(id){
  const p=S.pkgs.find(x=>x.id===id);if(!p)return;
  const on=pkgState(p)==='heute';
  try{await S.db.collection('packages').doc(id).update({status:on?'unterwegs':'heute',statusAt:Date.now(),statusBy:S.name||''});toast(on?'Zurückgesetzt':(p.for&&p.for!==S.name?p.for+' bekommt Bescheid':'Alle bekommen Bescheid'))}catch(e){handleWriteError(e)}
}
async function clearPkgs(){
  const ids=S.pkgs.filter(p=>pkgState(p)==='da').map(p=>p.id);
  try{for(const id of ids)await S.db.collection('packages').doc(id).delete();toast(ids.length===1?'1 Paket entfernt':ids.length+' Pakete entfernt')}catch(e){handleWriteError(e)}
}

/* ---------- Actions ---------- */
function openNameSheet(task,d){
  const host=$('#sheetHost');
  host.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Wer hat es gemacht?"><div><h2 style="font-size:20px">'+esc(task.t)+'</h2><p class="small muted" style="margin:2px 0 0">'+relDay(diffDays(today(),d))+' · Wer hat es gemacht?</p></div><div class="chips">'+FAMILY.filter(p=>!p.dog).map(p=>'<button class="chip" data-n="'+p.n+'" aria-pressed="'+(S.name===p.n)+'">'+p.n+'</button>').join('')+'</div><input id="nameIn" maxlength="30" placeholder="Oder Namen eingeben" value="'+esc(S.name)+'"><div class="row"><button class="btn" id="ok" style="flex:1">Erledigt</button><button class="btn ghost" id="cancel">Abbrechen</button></div></div></div>';
  const inp=$('#nameIn');
  host.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{inp.value=c.dataset.n;host.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c))}));
  inp.addEventListener('input',()=>host.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.n===inp.value.trim())));
  const close=()=>{host.innerHTML=''};
  $('#cancel').onclick=close;
  $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
  $('#ok').onclick=async()=>{
    const name=inp.value.trim();if(!name){inp.focus();inp.placeholder='Bitte Namen eingeben';return}
    if(FAMILY.some(p=>p.n===name)&&!S.name){S.name=name;lsSet('frahm-name',name)}
    close();await markDone(task,d,name);
  };
}
async function markDone(task,d,name){
  const id=key(d)+'_'+task.id;
  try{await S.db.collection('done').doc(id).set({date:key(d),task:task.id,name:name,at:Date.now()});toast('Abgehakt von '+name)}
  catch(e){handleWriteError(e)}
}
async function undo(task,d){
  try{await S.db.collection('done').doc(key(d)+'_'+task.id).delete();toast('Wieder offen')}catch(e){handleWriteError(e)}
}
async function saveMuell(ev){
  ev.preventDefault();
  const data={};
  BINS.forEach(b=>{const v=$('#m-'+b.id+'-d').value;data[b.id]={start:v||'',weeks:+$('#m-'+b.id+'-w').value,dates:[]}});
  try{await S.db.collection('config').doc('muell').set(data);S.editMuell=false;renderCal();renderHome();toast('Termine gespeichert')}catch(e){handleWriteError(e)}
}
function handleWriteError(e){
  if(e&&e.code==='permission-denied'){askCode('Der Familien-Code stimmt nicht. Bitte neu eingeben.');return}
  if(e&&e.code==='resource-exhausted'){toast('Speicher ist voll');return}
  toast('Speichern hat nicht geklappt. Nochmal versuchen.');
}
let toastT;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2200)}

async function addItem(ev){
  ev.preventDefault();const inp=$('#shopIn'),text=inp.value.trim();if(!text||!S.db)return;
  inp.value='';
  try{await S.db.collection('shopping').add({text:text,by:S.name||'',at:Date.now(),done:false})}catch(e){inp.value=text;handleWriteError(e)}
}
async function toggleItem(id){
  const x=S.shop.find(i=>i.id===id);if(!x)return;
  try{await S.db.collection('shopping').doc(id).update(x.done?{done:false,doneBy:'',doneAt:0}:{done:true,doneBy:S.name||'',doneAt:Date.now()})}catch(e){handleWriteError(e)}
}
async function deleteItem(id){try{await S.db.collection('shopping').doc(id).delete()}catch(e){handleWriteError(e)}}
async function clearBought(){
  const ids=S.shop.filter(x=>x.done).map(x=>x.id);
  try{for(const id of ids)await S.db.collection('shopping').doc(id).delete();toast(ids.length===1?'1 Eintrag entfernt':ids.length+' Einträge entfernt')}catch(e){handleWriteError(e)}
}
function openTaskSheet(){
  const host=$('#sheetHost'),sel=new Set([0,1,2,3,4,5,6]);let mode='repeat';
  host.innerHTML='<div class="scrim" id="scrim"><form class="sheet" id="taskForm" aria-label="Neue Aufgabe"><h2 style="font-size:20px">Neue Aufgabe</h2><input id="tName" maxlength="40" placeholder="z. B. Spülmaschine ausräumen" aria-label="Aufgabe"><div class="seg" id="tMode" role="group" aria-label="Wie oft?"><button type="button" data-m="repeat" aria-pressed="true">Wiederkehrend</button><button type="button" data-m="once" aria-pressed="false">Einmalig</button></div><select id="tSlot" aria-label="Tageszeit">'+SLOTS.map(x=>'<option value="'+x[0]+'"'+(x[0]===slotNow()?' selected':'')+'>'+x[1]+'</option>').join('')+'</select><div id="tRepeat"><h3>An welchen Tagen?</h3><div class="chips days">'+[1,2,3,4,5,6,0].map(i=>'<button type="button" class="chip" data-d="'+i+'" aria-pressed="true">'+WDS[i]+'</button>').join('')+'</div></div><div id="tOnce" hidden><h3>An welchem Tag?</h3><div class="chips" style="margin-bottom:8px"><button type="button" class="chip" data-q="0" aria-pressed="true">Heute</button><button type="button" class="chip" data-q="1" aria-pressed="false">Morgen</button></div><input type="date" id="tDate" aria-label="Datum" value="'+key(today())+'" min="'+key(today())+'"></div><label class="tfield">Frist bis Uhrzeit (optional)<input type="time" id="tDue" aria-label="Frist Uhrzeit"></label><select id="tWho" aria-label="Für wen"><option value="">Für alle</option>'+FAMILY.filter(p=>!p.dog).map(p=>'<option value="'+p.n+'">Für '+p.n+'</option>').join('')+'</select><div class="row"><button class="btn" type="submit" style="flex:1">Anlegen</button><button class="btn ghost" type="button" id="cancel">Abbrechen</button></div></form></div>';
  host.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.d;if(sel.has(i)){if(sel.size>1)sel.delete(i)}else sel.add(i);b.setAttribute('aria-pressed',sel.has(i))}));
  host.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;host.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#tRepeat').hidden=mode!=='repeat';$('#tOnce').hidden=mode!=='once'}));
  const quick=()=>host.querySelectorAll('[data-q]').forEach(x=>x.setAttribute('aria-pressed',$('#tDate').value===key(addDays(today(),+x.dataset.q))));
  host.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{$('#tDate').value=key(addDays(today(),+b.dataset.q));quick()}));
  $('#tDate').addEventListener('input',quick);
  const close=()=>{host.innerHTML=''};
  $('#cancel').onclick=close;
  $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
  $('#taskForm').addEventListener('submit',async e=>{
    e.preventDefault();const t=$('#tName').value.trim();if(!t){$('#tName').focus();$('#tName').placeholder='Bitte Aufgabe eingeben';return}
    const data={t:t,slot:$('#tSlot').value,who:$('#tWho').value,due:$('#tDue').value||'',at:Date.now()};
    if(mode==='once'){const dt=$('#tDate').value;if(!/^\d{4}-\d\d-\d\d$/.test(dt)||dt<key(today())){toast('Bitte ein Datum ab heute wählen');return}data.once=dt;data.days=[]}else data.days=[...sel].sort();
    close();
    let msg;
    if(data.once){const n=diffDays(today(),parse(data.once));msg=n===0?'Aufgabe für heute angelegt':'Angelegt für '+(n===1?'morgen':fmtShort(parse(data.once)))}
    else msg=data.days.includes(viewDate().getDay())?'Aufgabe angelegt':'Angelegt, erscheint an den gewählten Tagen';
    try{await S.db.collection('tasks').add(data);toast(msg)}catch(err){handleWriteError(err)}
  });
}
async function deleteTask(id){try{await S.db.collection('tasks').doc(id).delete();toast('Aufgabe gelöscht')}catch(e){handleWriteError(e)}}

function askCode(msg){

  $('#codeForm').addEventListener('submit',e=>{e.preventDefault();const c=$('#codeIn').value.trim();if(!c)return;lsSet('frahm-code',c);host.innerHTML='';connect()});

function connect(){
  unsubs.forEach(u=>u());unsubs=[];
  if(!window.firebase||FIREBASE_CONFIG.apiKey==='HIER_EINTRAGEN'){S.loading=false;S.canWrite=false;S.readOnlyReason='Speicher ist noch nicht eingerichtet.';render();return}
  const code=lsGet('frahm-code');
  if(!code){askCode();return}
  if(!firebase.apps.length){firebase.initializeApp(FIREBASE_CONFIG);try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}}
  const base=firebase.firestore().collection('families').doc(code);
  S.db={collection:n=>base.collection(n)};
  S.loading=false;S.canWrite=true;S.readOnlyReason='';render();
  const fail=e=>{if(e&&e.code==='permission-denied'){unsubs.forEach(u=>u());unsubs=[];S.db=null;askCode('Der Familien-Code stimmt nicht. Bitte neu eingeben.')}};
  const min=key(addDays(today(),-HISTORY-1));
  unsubs.push(base.collection('done').where('date','>=',min).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.task)m[v.date+'_'+v.task]=v});
    S.done=m;renderHome();renderTasks();renderBella();renderFamily();
  },fail));
  unsubs.push(base.collection('config').doc('muell').onSnapshot(snap=>{
    S.muell=snap.exists?snap.data():null;renderCal();renderHome();
  },fail));
  unsubs.push(base.collection('schedules').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.days)m[d.id]=v});S.sched=m;renderFamily();renderHome();
  },fail));
  unsubs.push(base.collection('config').doc('bella').onSnapshot(snap=>{S.bella=snap.exists?snap.data():{};renderBella()},fail));
  unsubs.push(base.collection('config').doc('push').onSnapshot(snap=>{
    const old=S.pushCfg&&S.pushCfg.vapidPublic;S.pushCfg=snap.exists?snap.data():{};
    if(old&&old!==S.pushCfg.vapidPublic&&S.push==='on'){S.push='off';pushReg().then(r=>r.pushManager.getSubscription()).then(s=>s&&s.unsubscribe()).catch(()=>{})}
    renderFamily();pushInit();
  },fail));
  unsubs.push(base.collection('config').doc('ai').onSnapshot(snap=>{S.aiCfg=snap.exists?snap.data():{};renderFamily()},fail));
  unsubs.push(base.collection('events').onSnapshot(snap=>{
    S.events=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(e=>e.title&&/^\d{4}-\d\d-\d\d$/.test(e.date||''));renderCal();renderHome();
  },fail));
  unsubs.push(base.collection('birthdays').onSnapshot(snap=>{
    S.bdays=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(b=>b.name&&/^\d{4}-\d\d-\d\d$/.test(b.date||''));S.bdaysLoaded=true;renderCal();renderHome();
  },fail));
  unsubs.push(base.collection('shopping').onSnapshot(snap=>{
    S.shop=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x.text);renderShop();renderHome();
  },fail));
  unsubs.push(base.collection('notes').onSnapshot(snap=>{
    S.notes=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(n=>n.text);renderFamily();renderHome();
  },fail));
  unsubs.push(base.collection('meals').where('date','>=',key(addDays(today(),-21))).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.date&&v.text)m[v.date]=Object.assign({id:d.id},v)});S.meals=m;renderShop();renderHome();
  },fail));
  unsubs.push(base.collection('packages').onSnapshot(snap=>{
    S.pkgs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));renderShop();renderHome();
  },fail));
  unsubs.push(base.collection('tasks').onSnapshot(snap=>{
    S.custom=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(c=>c.t&&SLOTS.some(x=>x[0]===c.slot)).sort((a,b)=>(a.at||0)-(b.at||0));renderTasks();renderHome();
  },fail));
}
connect();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
