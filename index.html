<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Frahm</title>
<meta name="apple-mobile-web-app-title" content="Frahm">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F6B4F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Sticky header with search, five pages side by side in a swipeable track, bottom bar with a raised Home button. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface-2:#E3EAE2; --fg:#15221B; --muted:#5B6B62; --line:#D3DDD3;
  --accent:#1F6B4F; --accent-ink:#FFFFFF; --accent-soft:#D6EBDF; --sun:#F2B705; --sun-soft:#FDF1C7; --danger:#B4412F;
  --rest:#4A4F55; --bio:#7A5A2E; --gelb:#E2B100; --papier:#2F64B4;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1612; --surface:#17221C; --surface-2:#1F2C25; --fg:#E6EEE9; --muted:#97A89E; --line:#2A3830;
  --accent:#5CC59A; --accent-ink:#0B1A13; --accent-soft:#1D3A2D; --sun:#F5C842; --sun-soft:#3A3115; --danger:#E7816F;
  --rest:#9AA1A8; --bio:#C29A61; --gelb:#F2CB3A; --papier:#79A6EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#17221C; --surface-2:#1F2C25; --fg:#E6EEE9; --muted:#97A89E; --line:#2A3830;
  --accent:#5CC59A; --accent-ink:#0B1A13; --accent-soft:#1D3A2D; --sun:#F5C842; --sun-soft:#3A3115; --danger:#E7816F;
  --rest:#9AA1A8; --bio:#C29A61; --gelb:#F2CB3A; --papier:#79A6EC; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.topline{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.brand span{color:var(--accent)}
.today{color:var(--muted);font-size:14px;font-weight:500;text-align:right}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 40px 11px 42px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;border-radius:10px;color:var(--muted)}
.viewport{flex:1;min-height:0;overflow:hidden;position:relative}
.track{display:flex;height:100%;width:500%;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.track.drag{transition:none}
.page{width:20%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 110px}
.page>*+*{margin-top:18px}
h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:14px}
.searchres{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.res b{display:block;font-weight:600}
.res small{color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:auto;white-space:nowrap}

/* Home */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center}
.hero h2{color:inherit;font-size:22px}
.hero p{margin:4px 0 0;opacity:.9;font-size:15px}
.ring{flex:none;width:76px;height:76px;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.alert{display:flex;gap:12px;align-items:center;background:var(--sun-soft);border:1px solid var(--sun);border-radius:var(--r);padding:14px}
.alert b{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px;min-width:0}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.open-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.open-list li{display:flex;justify-content:space-between;gap:10px;font-size:15px}

/* Aufgaben */
.daybar{display:flex;align-items:center;gap:8px}
.daybar h2{flex:1;text-align:center;font-size:20px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.slot{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;transition:background .2s}
.task.done{background:var(--accent-soft);border-color:transparent}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.task.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:18px;height:18px}
.task .txt{flex:1;min-width:0}
.task .txt b{display:block;font-weight:600}
.task.done .txt b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--accent)}
.task .who{font-size:13px;color:var(--muted)}
.task.done .who{color:var(--fg)}
.undo{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sun-soft);color:var(--fg)}
.note{font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:12px 14px}

/* Müll */
.bins{display:flex;flex-direction:column;gap:10px}
.bin{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.can{flex:none;width:40px;height:46px;border-radius:6px 6px 10px 10px;position:relative;background:var(--c)}
.can::before{content:"";position:absolute;left:-4px;right:-4px;top:-6px;height:8px;border-radius:4px;background:var(--c);filter:brightness(.8)}
.bin .txt{flex:1;min-width:0}
.bin .txt b{display:block}
.bin .when{font-family:var(--display);font-weight:800;font-size:18px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bin .when small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.soon .when{color:var(--danger)}
.form{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.frow label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.frow .lbl{grid-column:1/-1;font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.form input,.form select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:14px;padding:13px 18px;font-size:16px}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
a{color:var(--accent);font-weight:600}

/* Familie */
.people{display:flex;flex-direction:column;gap:10px}
.person{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;background:var(--c)}
.person .txt{flex:1;min-width:0}
.person .txt b{display:block;font-size:17px}
.person .bd{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.person .bd strong{display:block;font-family:var(--display);font-size:18px;color:var(--fg)}
.person.bday{border-color:var(--sun);background:var(--sun-soft)}

/* Familie: Einstellungen */
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 16px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Einkauf */
.shop-add{display:flex;gap:8px}
.shop-add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
#shopBody{display:flex;flex-direction:column;gap:12px}
#shopBody h3{margin:6px 0 0}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px 10px 14px}
.item.done{background:var(--surface-2);border-color:transparent}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .txt span{font-size:13px;color:var(--muted)}
.item.done .txt b{text-decoration:line-through;color:var(--muted)}
.item.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.del{border:0;background:none;color:var(--danger);font-size:14px;font-weight:700;padding:8px 10px;border-radius:10px}
/* Rangliste */
.rank{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center}
.rank li>div{min-width:0}
.rank .pos{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.rank li:first-child .pos{color:var(--sun)}
.rank .bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.rank .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rank .pts{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.addtask{border:1.5px dashed var(--line);background:none;border-radius:16px;padding:12px;font-weight:700;color:var(--accent);width:100%}
.sheet select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;font-size:16px}
.chips.days .chip{padding:8px 12px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pill.late{background:var(--danger,#d64545);color:#fff}
.tfield{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.tfield input{font-weight:500}

/* Kalender */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub{display:flex;flex-direction:column;gap:16px}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar h2{flex:1;text-align:center;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.cal button{border:0;background:none;border-radius:10px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;padding:0}
.cal button.out{color:var(--muted);opacity:.45}
.cal button.today{color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.cal .dots2{display:flex;gap:2px;height:5px}
.cal .dots2 i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cal button[aria-pressed="true"] .dots2 i{background:var(--accent-ink)}
.evlist{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 12px 14px;text-align:left;width:100%;box-sizing:border-box}
.ev .tm{flex:none;min-width:50px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.3}
.ev .tm small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:12px}
.ev .txt{flex:1;min-width:0}
.ev .txt b{display:block;font-weight:600;overflow-wrap:anywhere}
.ev .txt span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ev.bd{background:var(--sun-soft);border-color:transparent}
.ev .del{align-self:center}
.daylabel{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0}
.sheet{max-height:92vh;overflow-y:auto}
.sheet label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.sheet textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;font-size:16px;min-height:72px;resize:vertical;font-family:inherit}
.bdf{display:grid;grid-template-columns:.8fr 1.4fr 1.2fr;gap:8px;align-items:end}
.bdf label{min-width:0}
.bdf select,.bdf input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px;width:100%;box-sizing:border-box;font-size:16px;min-width:0}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .two label{min-width:0}
.detail p{margin:0}
.detail .desc{white-space:pre-wrap;overflow-wrap:anywhere}

/* Kalender-Liste */
.agenda{display:flex;flex-direction:column;gap:14px}
.agweek{font-family:var(--display);font-weight:800;font-size:17px;margin:6px 0 -2px}
.agday{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:start}
.agdate{text-align:center;padding-top:6px}
.agdate small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.agdate b{display:block;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.agday.is-today .agdate small{color:var(--accent)}
.agdate .agmon{font-size:12px;margin-top:1px}
button.agb,button.ev{cursor:pointer;font:inherit;color:inherit}
button.agb:active,button.ev:active{transform:scale(.98)}
.agday.is-today .agdate b{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:2px auto 0;font-size:20px}
.agitems{display:flex;flex-direction:column;gap:8px;min-width:0}
.agb{display:block;width:100%;box-sizing:border-box;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:12px 14px}
.agb b{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.agb span{display:block;font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.agb.empty{background:none;border-style:dashed;border-left-width:1px}
.agmore{text-align:center;font-size:13px;color:var(--muted);padding:8px 0}

/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;z-index:5}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--accent)}
nav .home{margin-top:-26px}
nav .home .hb{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(20,60,40,.28);border:4px solid var(--bg)}
nav .home svg{width:26px;height:26px}
.dots{position:absolute;left:0;right:0;bottom:88px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:all .25s}
.dots i.on{width:18px;background:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out;box-sizing:border-box}
.sheet input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;font-size:16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:30;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.track,.sheet,.task{transition:none;animation:none}}
@media (min-width:700px){.app{max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)} nav{max-width:520px;margin:0 auto}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="app">
  <header>
    <div class="topline">
      <div class="brand">Frahm<span>.</span></div>
      <div class="today" id="todayLabel"></div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Suchen: Aufgaben, Müll, Familie …" autocomplete="off" aria-label="Suchen">

<script>
(function(){
const FAMILY=[
  {n:'Linda',role:'Mama',b:'1982-03-28',c:'#C2557A'},

const SLOTS=[['morgens','Morgens'],['mittags','Mittags'],['abends','Abends']];
const TASKS=[
  {id:'bella-gassi-morgens',t:'Mit Bella rausgehen',slot:'morgens',k:'Hund'},
  {id:'bella-futter-morgens',t:'Bella Futter geben',slot:'morgens',k:'Hund'},

  {id:'abendbrot',t:'Abendbrot machen',slot:'abends',k:'Essen'},

const BINS=[
  {id:'rest',n:'Restabfall',sub:'graue Tonne',c:'var(--rest)',w:2},

  {id:'papier',n:'Papier',sub:'blaue Tonne',c:'var(--papier)',w:4}
];
const PAGES=['aufgaben','kalender','home','familie','einkauf'];
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const HISTORY=7;

const S={page:2,offset:0,agDays:60,agObs:null,events:[],bdays:[],bdaysLoaded:false,calTab:'termine',calMonth:null,calSel:'',done:{},muell:null,shop:[],custom:[],editTasks:false,db:null,canWrite:null,readOnlyReason:'',loading:true,q:'',editMuell:false,
  name:lsGet('frahm-name')||''};

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffDays(a,b){return Math.round((parse(key(b))-parse(key(a)))/864e5)}
function viewDate(){return addDays(today(),S.offset)}
function allTasks(){return TASKS.concat(S.custom.map(c=>{const once=/^\d{4}-\d\d-\d\d$/.test(c.once||'')?c.once:'';return {id:'c-'+c.id,t:c.t,slot:c.slot,k:once?'Einmalige Aufgabe':'Eigene Aufgabe',days:!once&&Array.isArray(c.days)&&c.days.length&&c.days.length<7?c.days:null,once,due:/^\d\d:\d\d$/.test(c.due||'')?c.due:'',who:c.who||'',custom:c.id}}))}
function tasksFor(d){const k=key(d);return allTasks().filter(t=>t.once?t.once===k:!t.days||t.days.includes(d.getDay()))}
/* Deadline passed and still open */
function isLate(d,t){if(!t.due||isDone(d,t))return false;const k=key(d),n=new Date(),nk=key(n);return k<nk||(k===nk&&String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')>t.due)}
function duePill(d,t){return t.due?'<span class="pill'+(isLate(d,t)?' late':'')+'">'+(isLate(d,t)?'Frist '+t.due+' vorbei':'bis '+t.due+' Uhr')+'</span>':''}
const WDS=['So','Mo','Di','Mi','Do','Fr','Sa'];
function daysLabel(t){if(!t.days)return '';const d=t.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7));return d.length===2&&d[0]===6&&d[1]===0?'Wochenende':d.map(i=>WDS[i]).join(', ')}
function weekStart(){const t=today();return addDays(t,-((t.getDay()+6)%7))}
/* One point per ticked task, Monday through today */
function ranking(){const from=key(weekStart()),to=key(today()),m={};Object.values(S.done).forEach(v=>{if(v.date>=from&&v.date<=to&&v.name){const n=String(v.name).trim();m[n]=(m[n]||0)+1}});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function fmtShort(d){return WD[d.getDay()].slice(0,2)+', '+d.getDate()+'. '+MO[d.getMonth()].slice(0,3)+'.'}
function relDay(n){return n===0?'Heute':n===1?'Morgen':n===-1?'Gestern':n===2?'Übermorgen':n>0?'in '+n+' Tagen':'vor '+(-n)+' Tagen'}
function relLow(n){const r=relDay(n);return /^(Heute|Morgen|Gestern|Übermorgen)$/.test(r)?r.toLowerCase():r}
function hhmm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function slotNow(){const h=new Date().getHours();return h<11?'morgens':h<16?'mittags':'abends'}

const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
  tasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="m8 11 2 2 4-4M8 17h8"/></svg>',
  bin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  cake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V12h16v9M2 21h20M4 16c2 1.5 4 1.5 5.3 0 1.4 1.5 4 1.5 5.4 0 1.3 1.5 3.3 1.5 5.3 0M12 12V8M12 5a1 1 0 0 1 0-2"/></svg>',
  paw:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6" r="2.2"/><circle cx="14" cy="6" r="2.2"/><circle cx="18" cy="10" r="2.2"/><path d="M12 11c-3 0-6 4.5-6 7 0 1.6 1.3 2.5 3 2.2 1.2-.2 2-.7 3-.7s1.8.5 3 .7c1.7.3 3-.6 3-2.2 0-2.5-3-7-6-7z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.8L21 8H6.2"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>'
};

/* ---------- Navigation & swipe ---------- */
const track=$('#track');
function go(i){
  S.page=Math.max(0,Math.min(PAGES.length-1,i));
  track.style.transform='translateX('+(-S.page*20)+'%)';
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===S.page?'page':'false'));
  document.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',j===S.page));
}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{if(+b.dataset.i===2&&S.page===2){clearSearch()}go(+b.dataset.i)}));
(function swipe(){
  const vp=$('#vp');let sx=0,sy=0,dx=0,mode=null;
  vp.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||e.target.closest('input,select,textarea')){mode='off';return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;mode=null;
  },{passive:true});
  vp.addEventListener('touchmove',e=>{
    if(mode==='off')return;
    const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(mode===null){if(Math.abs(x)>10&&Math.abs(x)>Math.abs(y)*1.2){mode='h';track.classList.add('drag')}else if(Math.abs(y)>10){mode='off';return}else return}
    dx=x;
    let edge=(S.page===0&&dx>0)||(S.page===PAGES.length-1&&dx<0)?0.3:1;
    track.style.transform='translateX(calc('+(-S.page*20)+'% + '+(dx*edge/5)+'px))';
  },{passive:true});
  vp.addEventListener('touchend',()=>{
    if(mode==='h'){track.classList.remove('drag');const w=vp.clientWidth;if(dx<-w*0.18)go(S.page+1);else if(dx>w*0.18)go(S.page-1);else go(S.page)}
    mode=null;
  });
  document.addEventListener('keydown',e=>{if(e.target.closest('input,select'))return;if(e.key==='ArrowRight')go(S.page+1);if(e.key==='ArrowLeft')go(S.page-1)});
})();

/* ---------- Data ---------- */
function isDone(d,t){return S.done[key(d)+'_'+t.id]}
/* Listed dates (from the AWSH calendar, holiday shifts included) win; after the last one the rhythm continues from the regular anchor date. */
function nextPickup(bin,from){
  const cfg=S.muell&&S.muell[bin.id];if(!cfg)return null;
  const dates=(Array.isArray(cfg.dates)?cfg.dates:[]).slice().sort();
  const listed=dates.find(k=>parse(k)>=from);
  if(listed)return parse(listed);
  if(!cfg.start)return null;
  const d=parse(cfg.start),step=(+cfg.weeks||bin.w)*7;
  let floor=from;const last=dates[dates.length-1];
  // half a cycle past the last listed date, so a holiday-shifted date isn't followed by its original slot
  if(last&&addDays(parse(last),Math.ceil(step/2))>floor)floor=addDays(parse(last),Math.ceil(step/2));
  if(d>=floor)return d;
  const n=Math.ceil(diffDays(d,floor)/step);return addDays(d,n*step);
}
function nextPickups(bin,from,count){
  const out=[];let f=from;
  for(let i=0;i<count;i++){const d=nextPickup(bin,f);if(!d)break;out.push(d);f=addDays(d,1)}
  return out;
}
function upcoming(){
  const t=today();
  return BINS.map(b=>({b,d:nextPickup(b,t)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
}
function nextBirthday(p){
  const t=today(),b=parse(p.b);let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());
  if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());
  return {date:n,days:diffDays(t,n),turns:n.getFullYear()-b.getFullYear()};
}
function age(p){const t=today(),b=parse(p.b);let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a}

/* ---------- Render ---------- */
S.calMonth=new Date(today().getFullYear(),today().getMonth(),1);S.calSel=key(today());
function render(){
  const t=today();
  $('#todayLabel').textContent=WD[t.getDay()]+', '+t.getDate()+'. '+MO[t.getMonth()];
  renderHome();renderTasks();renderCal();renderFamily();renderShop();
}

function statusNote(){
  if(S.loading)return '<div class="note">Verbinde mit dem Familienspeicher …</div>';
  if(S.readOnlyReason)return '<div class="note">'+esc(S.readOnlyReason)+'</div>';
  return '';
}

function renderHome(){
  const el=$('#p-home');
  if(S.q){el.innerHTML=renderSearch();bindSearch(el);return}
  const t=today(),list=tasksFor(t),done=list.filter(x=>isDone(t,x)).length,pct=list.length?done/list.length:0;
  const C=2*Math.PI*32;
  const hour=new Date().getHours();
  const greet=hour<11?'Guten Morgen':hour<18?'Hallo':'Guten Abend';
  const who=S.name?', '+esc(S.name):'';
  const open=list.filter(x=>!isDone(t,x));
  const up=upcoming();
  const soonBins=up.filter(x=>diffDays(t,x.d)<=1);
  const bdays=FAMILY.map(p=>({p,...nextBirthday(p)})).sort((a,b)=>a.days-b.days);
  const nb=bdays[0];
  const openShop=S.shop.filter(x=>!x.done).length,rk=ranking();
  const nev=S.events.filter(e=>e.date>=key(t)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))[0];
  let html='<div class="hero"><div class="ring"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="8"/><circle cx="38" cy="38" r="32" fill="none" stroke="var(--sun)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/></svg><div class="num">'+done+'/'+list.length+'</div></div><div><h2>'+greet+who+'!</h2><p>'+(open.length?open.length+(open.length===1?' Aufgabe ist':' Aufgaben sind')+' heute noch offen.':'Alle Aufgaben für heute sind erledigt.')+'</p></div></div>';
  html+=soonBins.map(x=>{const n=diffDays(t,x.d);return '<div class="alert"><span class="can" style="--c:'+x.b.c+';width:26px;height:30px"></span><div><b>'+(n===0?'Heute':'Morgen')+' kommt: '+x.b.n+'</b><span class="small muted">'+(n===0?'Tonne sollte schon draußen stehen.':'Heute Abend rausstellen.')+'</span></div></div>'}).join('');
  if(nb.days<=14)html+='<div class="alert"><span style="color:var(--sun)">'+ICON.cake.replace('<svg','<svg width="28" height="28"')+'</span><div><b>'+(nb.days===0?nb.p.n+' hat heute Geburtstag! 🎉':nb.p.n+' hat '+relLow(nb.days)+' Geburtstag')+'</b><span class="small muted">'+nb.p.n+' wird '+nb.turns+(nb.p.dog?' (Hundejahre: viele)':'')+' · '+fmtShort(nb.date)+'</span></div></div>';
  html+=statusNote();
  html+='<div class="card"><h3>Termine heute & morgen</h3><div class="evlist">'+[['Heute',t],['Morgen',addDays(t,1)]].map(([l,d])=>{const its=itemsOn(d);return '<p class="daylabel" style="margin-top:4px">'+l+' · '+fmtShort(d)+'</p>'+(its.length?its.map(evRow).join(''):'<p class="small muted" style="margin:0">Nichts eingetragen.</p>')}).join('')+'</div></div>';
  if(open.length){
    html+='<div class="card"><h3>Noch offen heute</h3><ul class="open-list">'+open.map(x=>'<li><span>'+esc(x.t)+'</span><span class="muted small">'+(x.due?(isLate(t,x)?'<b style="color:var(--danger,#d64545)">Frist '+x.due+' vorbei</b>':'bis '+x.due+' Uhr'):SLOTS.find(s=>s[0]===x.slot)[1])+'</span></li>').join('')+'</ul></div>';
  }
  if(rk.length)html+='<button class="res" data-go="3"><div><b>🏆 '+esc(rk[0][0])+' führt diese Woche</b><small>'+rk[0][1]+(rk[0][1]===1?' Punkt':' Punkte')+' · Rangliste ansehen</small></div><span class="tag">Punkte</span></button>';
  const nx=up[0];
  html+='<div class="tiles">'+
    tile(0,ICON.tasks,'Aufgaben',done+' von '+list.length+' erledigt')+
    tile(1,ICON.bin,'Müllabfuhr',nx?nx.b.n+' '+relLow(diffDays(t,nx.d)):'Termine eintragen','muell')+
    tile(1,ICON.cal,'Kalender',nev?nev.title+' · '+relLow(diffDays(t,parse(nev.date))):'Termin eintragen','termine')+
    tile(4,ICON.cart,'Einkaufsliste',openShop?openShop+(openShop===1?' Sache fehlt':' Sachen fehlen'):'Nichts offen')+
    '</div>';
  el.innerHTML=html;
  bindGo(el);
  bindItems(el);
}
function tile(i,ic,b,s,tab){return '<button class="tile" data-go="'+i+'"'+(tab?' data-tab="'+tab+'"':'')+'><span class="ic">'+ic+'</span><b>'+b+'</b><span>'+esc(s)+'</span></button>'}

function renderSearch(){
  const q=S.q.toLowerCase(),t=today(),res=[];
  allTasks().forEach(x=>{if((x.t+' '+x.k+' '+x.slot+' '+daysLabel(x)+' '+(x.who||'')).toLowerCase().includes(q)){const d=isDone(t,x);res.push({go:0,title:x.t,sub:SLOTS.find(s=>s[0]===x.slot)[1]+(x.days?' · '+daysLabel(x):'')+(x.once?' · einmalig am '+fmtShort(parse(x.once)):'')+(x.due?' · bis '+x.due+' Uhr':'')+(x.who?' · für '+x.who:'')+(d?' · erledigt von '+d.name:''),tag:'Aufgabe'})}});
  S.shop.forEach(x=>{if(String(x.text).toLowerCase().includes(q))res.push({go:4,title:x.text,sub:(x.done?'Gekauft':'Auf der Einkaufsliste')+(x.by?' · von '+x.by:''),tag:'Einkauf'})});
  if('einkaufsliste einkaufen'.includes(q))res.push({go:4,title:'Einkaufsliste',sub:S.shop.filter(x=>!x.done).length+' offen',tag:'Einkauf'});
  S.events.forEach(e=>{if((e.title+' '+(e.place||'')+' '+(e.persons||[]).join(' ')+' '+(e.desc||'')+' termin kalender').toLowerCase().includes(q)){const d=parse(e.date);res.push({go:1,tab:'termine',day:e.date,title:e.title,sub:fmtShort(d)+(d.getFullYear()!==t.getFullYear()?' '+d.getFullYear():'')+(e.time?' · '+e.time+' Uhr':'')+(e.place?' · '+e.place:''),tag:'Termin'})}});
  bdaysAll().forEach(b=>{if((b.name+' geburtstag').toLowerCase().includes(q))res.push({go:1,tab:'geburtstage',title:b.name,sub:'Geburtstag am '+bdLabel(b),tag:'Geburtstag'})});
  if('kalender termine'.includes(q))res.push({go:1,tab:'termine',title:'Kalender',sub:'Termine, Geburtstage und Müll',tag:'Kalender'});
  if('punkte rangliste'.includes(q))res.push({go:3,title:'Wochen-Rangliste',sub:'Wer hat diese Woche am meisten gemacht?',tag:'Familie'});
  BINS.forEach(b=>{if((b.n+' '+b.sub+' müll tonne abfuhr').toLowerCase().includes(q)){const d=nextPickup(b,t);res.push({go:1,tab:'muell',title:b.n,sub:d?fmtShort(d)+' ('+relDay(diffDays(t,d))+')':'Noch kein Termin eingetragen',tag:'Müll'})}});
  FAMILY.forEach(p=>{if((p.n+' '+p.role+' geburtstag').toLowerCase().includes(q)){const nb=nextBirthday(p);res.push({go:3,title:p.n,sub:p.role+' · Geburtstag '+fmtShort(nb.date),tag:'Familie'})}});

/* ---------- Kalender ---------- */
const MAXY=10;
function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0}
function bdaysAll(){return S.bdaysLoaded?S.bdays:FAMILY.map(p=>({id:'f-'+p.n,name:p.n,date:p.b}))}
/* Geburtstage: date ist "JJJJ-MM-TT", "0000-MM-TT" wenn das Jahr unbekannt ist */
function bdParts(b){const a=String(b.date).split('-').map(Number);return {y:a[0]||null,m:a[1]-1,d:a[2]}}
function bdLabel(b){const p=bdParts(b);return p.d+'. '+MO[p.m]+(p.y?' '+p.y:'')}
function bdAge(b,year){const p=bdParts(b);return p.y?year-p.y:null}
function bdNext(b){const t=today(),p=bdParts(b);let day=p.d;const mk=y=>new Date(y,p.m,p.m===1&&day===29&&!isLeap(y)?28:day);let n=mk(t.getFullYear());if(n<t)n=mk(t.getFullYear()+1);return n}
function bdayOn(b,d){const p=bdParts(b);if(p.m!==d.getMonth()||(p.y&&d.getFullYear()<p.y))return false;let day=p.d;if(p.m===1&&day===29&&!isLeap(d.getFullYear()))day=28;return day===d.getDate()}
function bdFields(pre,b,dis){
  const p=b?bdParts(b):{y:null,m:-1,d:0},x=dis?' disabled':'';
  return '<div class="bdf"><label class="f">Tag<select id="'+pre+'D"'+x+'><option value="">–</option>'+Array.from({length:31},(_,i)=>'<option'+(p.d===i+1?' selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label>'+
    '<label class="f">Monat<select id="'+pre+'M"'+x+'><option value="">–</option>'+MO.map((m,i)=>'<option value="'+i+'"'+(p.m===i?' selected':'')+'>'+m+'</option>').join('')+'</select></label>'+
    '<label class="f">Jahr (optional)<input id="'+pre+'Y" inputmode="numeric" maxlength="4" placeholder="z. B. 1960" value="'+(p.y||'')+'"'+x+'></label></div>';
}
function bdRead(pre){
  const d=+$('#'+pre+'D').value,mv=$('#'+pre+'M').value,ys=$('#'+pre+'Y').value.trim();
  if(!d||mv===''){toast('Bitte Tag und Monat wählen');return null}
  const m=+mv,maxD=[31,29,31,30,31,30,31,31,30,31,30,31][m];
  if(d>maxD){toast('Den '+d+'. '+MO[m]+' gibt es nicht');return null}
  let y=0;
  if(ys){y=+ys;if(!/^\d{4}$/.test(ys)||y<1900||y>today().getFullYear()){toast('Jahr bitte vierstellig, z. B. 1960, oder leer lassen');return null}
    if(m===1&&d===29&&!isLeap(y)){toast(y+' hatte keinen 29. Februar');return null}}
  return String(y).padStart(4,'0')+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function itemsOn(d){
  const k=key(d),out=[];
  S.events.filter(e=>e.date===k).forEach(e=>out.push({kind:'ev',e,time:e.time||''}));
  bdaysAll().filter(b=>bdayOn(b,d)).forEach(b=>out.push({kind:'bd',b,time:'',age:bdAge(b,d.getFullYear())}));
  BINS.forEach(bin=>{const p=nextPickup(bin,d);if(p&&key(p)===k)out.push({kind:'muell',bin,time:''})});
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function longDate(d){return WD[d.getDay()]+', '+d.getDate()+'. '+MO[d.getMonth()]+' '+d.getFullYear()}
function evRow(it){
  if(it.kind==='ev'){const e=it.e;return '<button class="ev" data-ev="'+esc(e.id)+'"><span class="tm">'+(e.time?esc(e.time):'<small>ganztägig</small>')+'</span><span class="txt"><b>'+esc(e.title)+'</b>'+(e.place?'<span>Ort: '+esc(e.place)+'</span>':'')+(e.persons&&e.persons.length?'<span>Mit: '+esc(e.persons.join(', '))+'</span>':'')+'</span></button>'}
  if(it.kind==='bd')return '<button class="ev bd" data-bd="'+esc(it.b.id)+'"><span class="tm">🎂</span><span class="txt"><b>'+esc(it.b.name)+' hat Geburtstag</b>'+(it.age>0?'<span>wird '+it.age+'</span>':'')+'</span></button>';
  return '<button class="ev" data-muell="1"><span class="tm"><span class="can" style="--c:'+it.bin.c+';width:18px;height:22px;display:block;margin:4px 0 0 6px"></span></span><span class="txt"><b>'+it.bin.n+'</b><span>Müllabfuhr · Tonne am Vorabend rausstellen</span></span></button>';
}

function renderTermine(){
  const box=$('#calTermine'),t=today(),m=S.calMonth,y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),start=addDays(first,-((first.getDay()+6)%7));
  const minM=new Date(t.getFullYear()-1,t.getMonth(),1),maxM=new Date(t.getFullYear()+MAXY,t.getMonth(),1);
  let g='<div class="cal">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>'<span class="wd">'+w+'</span>').join('');
  for(let i=0;i<42;i++){
    const d=addDays(start,i);if(i===35&&d.getMonth()!==mo)break;
    const k=key(d),its=itemsOn(d);
    const dots=[...new Set(its.map(x=>x.kind))].map(kd=>'<i style="--c:'+(kd==='ev'?'var(--accent)':kd==='bd'?'var(--sun)':'var(--muted)')+'"></i>').join('');
    g+='<button class="'+(d.getMonth()!==mo?'out ':'')+(k===key(t)?'today':'')+'" data-day="'+k+'" aria-pressed="'+(k===S.calSel)+'" aria-label="'+d.getDate()+'. '+MO[d.getMonth()]+(its.length?', '+its.length+(its.length===1?' Eintrag':' Einträge'):'')+'">'+d.getDate()+'<span class="dots2">'+dots+'</span></button>';
  }
  g+='</div>';
  const sel=parse(S.calSel),its=itemsOn(sel),atToday=S.calSel===key(t)&&y===t.getFullYear()&&mo===t.getMonth();
  let html='<div class="monthbar"><button class="iconbtn" id="mPrev" aria-label="Monat zurück" '+(m<=minM?'disabled':'')+'>'+ICON.left+'</button><h2>'+MO[mo]+' '+y+'</h2><button class="iconbtn" id="mNext" aria-label="Monat vor" '+(m>=maxM?'disabled':'')+'>'+ICON.right+'</button></div>'+g;
  html+='<div class="row" style="justify-content:space-between;align-items:center;min-height:34px"><p class="daylabel">'+relDay(diffDays(t,sel))+' · '+fmtShort(sel)+(y!==t.getFullYear()?' '+sel.getFullYear():'')+'</p>'+(atToday?'':'<button class="undo" id="calToday">Zu heute</button>')+'</div>';
  html+=its.length?'<div class="evlist">'+its.map(evRow).join('')+'</div>':'<p class="small muted" style="margin:0">Keine Termine an diesem Tag.</p>';
  if(S.canWrite)html+='<button class="addtask" id="addEv">+ Termin hinzufügen</button>';
  else html+=statusNote();
  html+='<div class="sub"><h3 style="margin:0">Liste ab heute</h3><div class="agenda" id="agenda"></div><div class="agmore" id="agMore"></div></div>';
  box.innerHTML=html;
  $('#mPrev').onclick=()=>{S.calMonth=new Date(y,mo-1,1);renderTermine()};
  $('#mNext').onclick=()=>{S.calMonth=new Date(y,mo+1,1);renderTermine()};
  const ct=$('#calToday');if(ct)ct.onclick=()=>{S.calSel=key(t);S.calMonth=new Date(t.getFullYear(),t.getMonth(),1);renderTermine()};
  box.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{S.calSel=b.dataset.day;const d=parse(S.calSel);if(d.getMonth()!==mo)S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);renderTermine()}));
  bindItems(box);
  const ae=$('#addEv');if(ae)ae.onclick=()=>openEventSheet(null,S.calSel);
  renderAgenda();
}
function bindItems(el){
  el.querySelectorAll('[data-ev]').forEach(b=>b.addEventListener('click',()=>openEventDetail(b.dataset.ev)));
  el.querySelectorAll('[data-bd]').forEach(b=>b.addEventListener('click',()=>openBdaySheet(b.dataset.bd)));
  el.querySelectorAll('[data-muell]').forEach(b=>b.addEventListener('click',()=>{S.calTab='muell';renderCal();go(1);$('#p-kalender').scrollTo({top:0,behavior:'smooth'});toast('Hier kannst du die Müll-Termine ändern')}));

function openBdaySheet(id){
  const b=bdaysAll().find(x=>x.id===id);if(!b)return;

    '<label class="f">Name<input id="bdName" maxlength="40" value="'+esc(b.name)+'" '+(editable?'':'disabled')+'></label>'+
    bdFields('bdE',b,!editable)+
    '<div class="row">'+(editable?'<button class="btn" type="submit" style="flex:1">Speichern</button><button class="btn ghost" type="button" id="bdDel" style="color:var(--danger)">Löschen</button>':'')+'<button class="btn ghost" type="button" id="cancel">Schließen</button></div></form></div>';
  const close=()=>{host.innerHTML=''};
  $('#cancel').onclick=close;
  $('#scrim').addEventListener('click',x=>{if(x.target.id==='scrim')close()});
  if(!editable)return;

  $('#bdForm').addEventListener('submit',async x=>{

    const d=bdRead('bdE');if(!d)return;

  });
}
function isoWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
function agBlock(it){
  if(it.kind==='ev'){const e=it.e;return '<button class="agb" style="--c:var(--accent)" data-ev="'+esc(e.id)+'"><b>'+esc(e.title)+'</b><span>'+(e.time?esc(e.time)+' Uhr':'Ganztägig')+(e.place?' · '+esc(e.place):'')+'</span><span>'+(e.persons&&e.persons.length?'Mit '+esc(e.persons.join(', ')):'Für alle')+'</span></button>'}
  if(it.kind==='bd')return '<button class="agb" style="--c:var(--sun)" data-bd="'+esc(it.b.id)+'"><b>🎂 '+esc(it.b.name)+' hat Geburtstag</b><span>Ganztägig'+(it.age>0?' · wird '+it.age:'')+'</span></button>';
  return '<button class="agb" style="--c:'+it.bin.c+'" data-muell="1"><b>'+it.bin.n+'</b><span>Müllabfuhr · Am Heeschberg 6</span><span>Tonne am Vorabend rausstellen</span></button>';
}
/* Tagesliste ab heute, lädt beim Scrollen weitere Tage nach (bis 10 Jahre) */
function renderAgenda(){
  const box=$('#agenda'),more=$('#agMore');if(!box)return;
  const t=today(),cap=diffDays(t,new Date(t.getFullYear()+MAXY,t.getMonth()+1,0));
  const n=Math.min(S.agDays,cap);let html='',lastWeek=null;
  for(let i=0;i<=n;i++){
    const d=addDays(t,i),its=itemsOn(d);
    if(!its.length&&i>0)continue;
    const w=isoWeek(d);
    if(w!==lastWeek&&lastWeek!==null)html+='<p class="agweek">KW '+w+(d.getFullYear()!==t.getFullYear()?' · '+d.getFullYear():'')+'</p>';
    lastWeek=w;
    html+='<div class="agday'+(i===0?' is-today':'')+'"><div class="agdate"><small>'+WD[d.getDay()].slice(0,2)+'.</small><b>'+d.getDate()+'</b>'+'<small class="agmon">'+(MO[d.getMonth()].length>4?MO[d.getMonth()].slice(0,3).toLowerCase()+'.':MO[d.getMonth()].toLowerCase())+'</small>'+'</div><div class="agitems">'+(its.length?its.map(agBlock).join(''):'<div class="agb empty" style="--c:var(--line)"><span>Heute nichts eingetragen</span></div>')+'</div></div>';
  }
  box.innerHTML=html;
  bindItems(box);
  const done=n>=cap;
  more.textContent=done?'Ende der Liste: 10 Jahre im Voraus':'Weitere Tage werden geladen …';
  if(S.agObs)S.agObs.disconnect();S.agObs=null;
  if(!done&&'IntersectionObserver' in window){
    S.agObs=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){S.agObs.disconnect();S.agDays+=90;renderAgenda()}},{rootMargin:'400px'});
    S.agObs.observe(more);
  }
}
function renderGeb(){
  const t=today();
  const list=bdaysAll().map(b=>{const n=bdNext(b);return {b,n,days:diffDays(t,n),turns:bdAge(b,n.getFullYear())}}).sort((a,b)=>a.days-b.days);
  let html='<p class="small muted" style="margin:0">Geburtstage stehen jedes Jahr automatisch im Kalender.</p>'+statusNote();
  html+=list.length?'<div class="evlist">'+list.map(x=>'<div class="ev bd"><span class="tm">🎂</span><span class="txt"'+(S.canWrite&&S.bdaysLoaded?' data-bd="'+esc(x.b.id)+'" role="button" tabindex="0" style="cursor:pointer"':'')+'><b>'+esc(x.b.name)+'</b><span>'+bdLabel(x.b)+(x.turns?' · wird '+x.turns:'')+' · '+(x.days===0?'heute!':relDay(x.days))+'</span></span>'+(S.canWrite&&S.bdaysLoaded?'<button class="del" data-bdel="'+esc(x.b.id)+'" aria-label="'+esc(x.b.name)+' löschen">✕</button>':'')+'</div>').join('')+'</div>':'<p class="small muted" style="margin:0">Noch keine Geburtstage eingetragen.</p>';
  const box=$('#gebList');box.innerHTML=html;bindItems(box);
  box.querySelectorAll('[data-bdel]').forEach(b=>b.addEventListener('click',()=>{
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Löschen?';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='✕'}},3000);return}
    deleteBday(b.dataset.bdel);
  }));
}

function openEventSheet(ev,dateKey){
  const host=$('#sheetHost'),e=ev||{},ppl=new Set(e.persons||[]);
  const minK=key(new Date(today().getFullYear()-1,today().getMonth(),1)),maxK=key(new Date(today().getFullYear()+MAXY,today().getMonth()+1,0));
  host.innerHTML='<div class="scrim" id="scrim"><form class="sheet" id="evForm" aria-label="Termin"><h2 style="font-size:20px">'+(ev?'Termin bearbeiten':'Neuer Termin')+'</h2>'+
    '<label class="f">Titel<input id="eTitle" maxlength="60" value="'+esc(e.title||'')+'" placeholder="z. B. Zahnarzt" autocomplete="off"></label>'+
    '<label class="f">Ort<input id="ePlace" maxlength="80" value="'+esc(e.place||'')+'" placeholder="z. B. Bad Oldesloe" autocomplete="off"></label>'+
    '<div class="two"><label class="f">Datum<input type="date" id="eDate" value="'+esc(e.date||dateKey)+'" min="'+minK+'" max="'+maxK+'"></label><label class="f">Uhrzeit<input type="time" id="eTime" value="'+esc(e.time||'')+'"></label></div>'+
    '<div><h3>Wer ist dabei?</h3><div class="chips">'+FAMILY.map(p=>'<button type="button" class="chip" data-p="'+p.n+'" aria-pressed="'+ppl.has(p.n)+'">'+p.n+'</button>').join('')+'</div></div>'+
    '<label class="f">Beschreibung (optional)<textarea id="eDesc" maxlength="500">'+esc(e.desc||'')+'</textarea></label>'+
    '<div class="row"><button class="btn" type="submit" style="flex:1">Speichern</button><button class="btn ghost" type="button" id="cancel">Abbrechen</button></div></form></div>';
  host.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.p;ppl.has(n)?ppl.delete(n):ppl.add(n);b.setAttribute('aria-pressed',ppl.has(n))}));
  const close=()=>{host.innerHTML=''};
  $('#cancel').onclick=close;
  $('#scrim').addEventListener('click',x=>{if(x.target.id==='scrim')close()});
  $('#evForm').addEventListener('submit',async x=>{
    x.preventDefault();
    const title=$('#eTitle').value.trim(),date=$('#eDate').value,time=$('#eTime').value;
    if(!title){$('#eTitle').focus();toast('Bitte einen Titel eingeben');return}
    if(!/^\d{4}-\d\d-\d\d$/.test(date)||date<minK||date>maxK){$('#eDate').focus();toast('Bitte ein Datum bis '+MAXY+' Jahre im Voraus wählen');return}
    const data={title,place:$('#ePlace').value.trim(),date,time:/^\d\d:\d\d$/.test(time)?time:'',persons:FAMILY.map(p=>p.n).filter(n=>ppl.has(n)),desc:$('#eDesc').value.trim(),at:e.at||Date.now(),by:e.by||S.name||''};
    if(!S.db)return;
    close();
    try{
      if(ev)await S.db.collection('events').doc(ev.id).set(data);else await S.db.collection('events').add(data);
      S.calSel=date;const d=parse(date);S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);renderCal();
      toast(ev?'Termin geändert':'Termin eingetragen');
    }catch(err){handleWriteError(err)}
  });
}

function openNameSheet(task,d){
  const host=$('#sheetHost');
  host.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Wer hat es gemacht?"><div><h2 style="font-size:20px">'+esc(task.t)+'</h2><p class="small muted" style="margin:2px 0 0">'+relDay(diffDays(today(),d))+' · Wer hat es gemacht?</p></div><div class="chips">'+FAMILY.filter(p=>!p.dog).map(p=>'<button class="chip" data-n="'+p.n+'" aria-pressed="'+(S.name===p.n)+'">'+p.n+'</button>').join('')+'</div><input id="nameIn" maxlength="30" placeholder="Oder Namen eingeben" value="'+esc(S.name)+'"><div class="row"><button class="btn" id="ok" style="flex:1">Erledigt</button><button class="btn ghost" id="cancel">Abbrechen</button></div></div></div>';

  inp.addEventListener('input',()=>host.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.n===inp.value.trim())));

async function markDone(task,d,name){
  const id=key(d)+'_'+task.id;
  try{await S.db.collection('done').doc(id).set({date:key(d),task:task.id,name:name,at:Date.now()});toast('Abgehakt von '+name)}
  catch(e){handleWriteError(e)}
}
async function undo(task,d){
  try{await S.db.collection('done').doc(key(d)+'_'+task.id).delete();toast('Wieder offen')}catch(e){handleWriteError(e)}
}
async function saveMuell(ev){
  ev.preventDefault();
  const data={};
  BINS.forEach(b=>{const v=$('#m-'+b.id+'-d').value;data[b.id]={start:v||'',weeks:+$('#m-'+b.id+'-w').value,dates:[]}});
  try{await S.db.collection('config').doc('muell').set(data);S.editMuell=false;renderCal();renderHome();toast('Termine gespeichert')}catch(e){handleWriteError(e)}

function handleWriteError(e){
  if(e&&e.code==='permission-denied'){askCode('Der Familien-Code stimmt nicht. Bitte neu eingeben.');return}
  if(e&&e.code==='resource-exhausted'){toast('Speicher ist voll');return}
  toast('Speichern hat nicht geklappt. Nochmal versuchen.');
}
let toastT;
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2200)}

async function addItem(ev){
  ev.preventDefault();const inp=$('#shopIn'),text=inp.value.trim();if(!text||!S.db)return;
  inp.value='';
  try{await S.db.collection('shopping').add({text:text,by:S.name||'',at:Date.now(),done:false})}catch(e){inp.value=text;handleWriteError(e)}

async function toggleItem(id){
  const x=S.shop.find(i=>i.id===id);if(!x)return;

}
async function deleteItem(id){try{await S.db.collection('shopping').doc(id).delete()}catch(e){handleWriteError(e)}}
async function clearBought(){
  const ids=S.shop.filter(x=>x.done).map(x=>x.id);

function connect(){
  unsubs.forEach(u=>u());unsubs=[];
  if(!window.firebase||FIREBASE_CONFIG.apiKey==='HIER_EINTRAGEN'){S.loading=false;S.canWrite=false;S.readOnlyReason='Speicher ist noch nicht eingerichtet.';render();return}
  const code=lsGet('frahm-code');
  if(!code){askCode();return}
  if(!firebase.apps.length){firebase.initializeApp(FIREBASE_CONFIG);try{firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}}
  const base=firebase.firestore().collection('families').doc(code);
  S.db={collection:n=>base.collection(n)};
  S.loading=false;S.canWrite=true;S.readOnlyReason='';render();
  const fail=e=>{if(e&&e.code==='permission-denied'){unsubs.forEach(u=>u());unsubs=[];S.db=null;askCode('Der Familien-Code stimmt nicht. Bitte neu eingeben.')}};
  const min=key(addDays(today(),-HISTORY-1));
  unsubs.push(base.collection('done').where('date','>=',min).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.task)m[v.date+'_'+v.task]=v});
    S.done=m;renderHome();renderTasks();renderFamily();
  },fail));
  unsubs.push(base.collection('config').doc('muell').onSnapshot(snap=>{
    S.muell=snap.exists?snap.data():null;renderCal();renderHome();
  },fail));
  unsubs.push(base.collection('events').onSnapshot(snap=>{
    S.events=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(e=>e.title&&/^\d{4}-\d\d-\d\d$/.test(e.date||''));renderCal();renderHome();
  },fail));
  unsubs.push(base.collection('birthdays').onSnapshot(snap=>{
    S.bdays=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(b=>b.name&&/^\d{4}-\d\d-\d\d$/.test(b.date||''));S.bdaysLoaded=true;renderCal();renderHome();
  },fail));
  unsubs.push(base.collection('shopping').onSnapshot(snap=>{
    S.shop=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x.text);renderShop();renderHome();
  },fail));
  unsubs.push(base.collection('tasks').onSnapshot(snap=>{
    S.custom=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(c=>c.t&&SLOTS.some(x=>x[0]===c.slot)).sort((a,b)=>(a.at||0)-(b.at||0));renderTasks();renderHome();
  },fail));
}
connect();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
