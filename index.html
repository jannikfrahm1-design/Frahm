<title>Frahm</title>

<script>
/* Darstellung sofort anwenden (vor dem ersten Bild), Einstellungen liegen nur auf diesem Gerät */
window.frahmApplyUI=function(u){
  var r=document.documentElement,t=u.theme||'dark',mq=window.matchMedia&&matchMedia('(prefers-color-scheme: light)');
  if(t==='auto')t=mq&&mq.matches?'light':'dark';
  r.dataset.theme=t;
  if(u.accent&&u.accent!=='blau')r.dataset.accent=u.accent;else delete r.dataset.accent;
  if(u.contrast==='high')r.dataset.contrast='high';else delete r.dataset.contrast;
  if(u.size&&u.size!=='m')r.dataset.size=u.size;else delete r.dataset.size;
  if(u.motion==='reduce')r.dataset.motion='reduce';else delete r.dataset.motion;
  var b=Math.max(40,Math.min(100,+u.bright||100));r.style.setProperty('--dim',((100-b)/100*.85).toFixed(3));
  var c={dark:'#04060B',black:'#000000',light:'#F2F4F8'}[t];
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=c});
  var sb=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');if(sb)sb.content=t==='light'?'default':'black-translucent';
};
try{frahmApplyUI(JSON.parse(localStorage.getItem('frahm-ui')||'{}'))}catch(e){frahmApplyUI({})}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Frahm – Design „Midnight Blue“. Layout: one-screen phone app. Header with search, six pages side by side in a swipeable track, floating bottom bar with a raised Home button.
   Einstellungen (pro Gerät, localStorage „frahm-ui“) setzen data-theme, data-accent, data-contrast, data-size und data-motion auf <html>. */
:root{
  /* Akzentfarbe als RGB-Tripel, damit überall Transparenzen gehen: a = Hauptton, a2 = tief, a3 = hell */
  --a-rgb:61 139 255; --a2-rgb:37 99 235; --a3-rgb:125 180 255; --a3-txt:var(--a3-rgb);
  --g1:#1E40AF; --g2:#2563EB; --g3:#3D8BFF; --g4:#6AA8FF; --accent-ink:#FFFFFF;
  --bg:#04060B; --bg-2:#070B14; --surface:#0C1220; --surface-2:#131B2C; --surface-3:#1A2438; --fg:#EAF0FB; --muted:#8B97AE; --line:#1C2740; --line-2:#26334F;
  --glass:12 18 32; --nav-ink:#6F7B93; --ph:#5F6B82; --brand-2:#B9CCEB; --scheme:dark;
  --accent:rgb(var(--a-rgb)); --accent-2:rgb(var(--a2-rgb)); --accent-3:rgb(var(--a3-txt)); --accent-soft:rgb(var(--a-rgb) / .14);
  --sun:#FFB547; --sun-soft:rgba(255,181,71,.10); --danger:#FF6B72;
  --rest:#9AA4B2; --bio:#C69A5E; --gelb:#F2CB3A; --papier:#5B9DFF;
  --grad:linear-gradient(135deg,var(--g1) 0%,var(--g2) 42%,var(--g3) 78%,var(--g4) 100%);
  --grad-soft:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%);
  --hi:inset 0 1px 0 rgba(255,255,255,.045);
  --sh-1:var(--hi),0 1px 2px rgba(0,0,0,.5),0 10px 28px -16px rgba(0,0,0,.9);
  --sh-2:var(--hi),0 2px 6px rgba(0,0,0,.45),0 24px 48px -20px rgba(0,0,0,.95);
  --glow:0 10px 30px -10px rgb(var(--a2-rgb) / .75),0 0 0 1px rgb(var(--a3-rgb) / .18) inset;
  --display:"Plus Jakarta Sans", "SF Pro Display", system-ui, sans-serif;
  --body:"Inter", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --r:20px;
  color-scheme:var(--scheme);
}
/* Akzentfarben */
:root[data-accent="violett"]{--a-rgb:139 92 246;--a2-rgb:109 40 217;--a3-rgb:196 181 253;--g1:#4C1D95;--g2:#6D28D9;--g3:#8B5CF6;--g4:#A78BFA}
:root[data-accent="gruen"]{--a-rgb:16 185 129;--a2-rgb:5 150 105;--a3-rgb:110 231 183;--g1:#065F46;--g2:#059669;--g3:#10B981;--g4:#34D399}
:root[data-accent="tuerkis"]{--a-rgb:6 182 212;--a2-rgb:8 145 178;--a3-rgb:103 232 249;--g1:#155E75;--g2:#0891B2;--g3:#06B6D4;--g4:#22D3EE}
:root[data-accent="orange"]{--a-rgb:249 115 22;--a2-rgb:234 88 12;--a3-rgb:253 186 116;--g1:#9A3412;--g2:#EA580C;--g3:#F97316;--g4:#FB923C}
:root[data-accent="rosa"]{--a-rgb:236 72 153;--a2-rgb:219 39 119;--a3-rgb:249 168 212;--g1:#9D174D;--g2:#DB2777;--g3:#EC4899;--g4:#F472B6}
:root[data-accent="mono"]{--a-rgb:229 231 235;--a2-rgb:156 163 175;--a3-rgb:243 244 246;--g1:#9CA3AF;--g2:#D1D5DB;--g3:#E5E7EB;--g4:#FFFFFF;--accent-ink:#0A0A0A}
/* Design: Schwarz (echtes Schwarz, spart Akku bei OLED) */
:root[data-theme="black"]{--bg:#000000;--bg-2:#050506;--surface:#0E0E10;--surface-2:#17171A;--surface-3:#222226;--fg:#F4F4F5;--muted:#9A9AA3;--line:#1E1E22;--line-2:#2D2D33;--glass:12 12 14;--nav-ink:#7A7A84;--ph:#66666F;--brand-2:#C9C9D1}
/* Design: Hell */
:root[data-theme="light"]{--bg:#F2F4F8;--bg-2:#FFFFFF;--surface:#FFFFFF;--surface-2:#F1F4F9;--surface-3:#E3E8F0;--fg:#0E1726;--muted:#5B6779;--line:#E1E6EE;--line-2:#CBD3DF;
  --glass:255 255 255;--nav-ink:#8390A3;--ph:#9AA5B5;--brand-2:#334155;--scheme:light;--a3-txt:var(--a2-rgb);
  --sun:#B86E00;--sun-soft:rgba(245,158,11,.12);--danger:#DC2626;
  --grad-soft:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0) 60%);
  --hi:inset 0 1px 0 rgba(255,255,255,.7);
  --sh-1:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.22);
  --sh-2:0 2px 6px rgba(16,24,40,.06),0 24px 48px -24px rgba(16,24,40,.3)}
:root[data-theme="light"][data-accent="mono"]{--a-rgb:31 41 55;--a2-rgb:17 24 39;--a3-rgb:75 85 99;--g1:#030712;--g2:#111827;--g3:#1F2937;--g4:#374151;--accent-ink:#FFFFFF}
/* Kontrast hoch */
:root[data-contrast="high"]{--fg:#FFFFFF;--muted:#C2CBDA;--line:#34425F;--line-2:#4A5A7C}
:root[data-contrast="high"][data-theme="black"]{--muted:#C4C4CC;--line:#3A3A42;--line-2:#55555F}
:root[data-contrast="high"][data-theme="light"]{--fg:#000000;--muted:#2F3A4B;--line:#AEB9C9;--line-2:#8C99AD}
/* Schriftgröße */
:root[data-size="s"] body{zoom:.92}
:root[data-size="l"] body{zoom:1.08}
:root[data-size="xl"] body{zoom:1.16}
/* Leiste unten bleibt gleich groß, sonst passen die Beschriftungen nicht */
:root[data-size="s"] nav{zoom:1.087}
:root[data-size="l"] nav{zoom:.926}
:root[data-size="xl"] nav{zoom:.862}
:root[data-size="xl"] .today{display:none}
/* Helligkeit: dunkelt alles über eine Folie ab, die Klicks durchlässt */
#dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:100;opacity:var(--dim,0)}
html,body{height:100%}
html{background:var(--bg)}
body{background:
  radial-gradient(120% 60% at 50% -12%,rgb(var(--a2-rgb) / .22),rgb(var(--a2-rgb) / 0) 60%),
  radial-gradient(80% 40% at 100% 110%,rgb(var(--a-rgb) / .08),rgb(var(--a-rgb) / 0) 70%),
  var(--bg);
  color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01","ss03";letter-spacing:-.006em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
::selection{background:rgb(var(--a-rgb) / .35)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;transition:transform .18s var(--ease),background-color .2s,border-color .2s,box-shadow .2s,color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent-3);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 4px rgb(var(--a-rgb) / .18)}
.app{height:100%;display:flex;flex-direction:column}
header{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 12px;display:flex;flex-direction:column;gap:12px;background:transparent;position:relative;z-index:2}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.035em;line-height:1;background:linear-gradient(180deg,var(--fg) 30%,var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 8px rgb(var(--a-rgb) / .7))}
.today{color:var(--muted);font-size:12px;font-weight:600;text-align:right;text-transform:uppercase;letter-spacing:.09em;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:rgb(var(--glass) / .6)}
.search{position:relative}
.search svg{position:absolute;z-index:1;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:rgb(var(--glass) / .72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:14px;padding:12px 42px 12px 42px;font-size:16px;box-shadow:var(--hi);transition:border-color .2s,box-shadow .2s,background .2s}
.search input:focus{background:var(--surface)}
.search input::placeholder{color:var(--ph)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:12px}
.search .clear:active{transform:translateY(-50%) scale(.94)}
.viewport{flex:1;min-height:0;overflow:hidden;position:relative}
.track{display:flex;height:100%;width:600%;transition:transform .42s cubic-bezier(.22,.9,.24,1)}
.track.drag{transition:none}
.page{width:16.6667%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:6px 128px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page>*+*{margin-top:18px}
h2{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.03em;margin:0;text-wrap:balance;line-height:1.15}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:700}
.card{background:var(--grad-soft),var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line);box-shadow:var(--sh-1)}
.muted{color:var(--muted)}
.small{font-size:14px}
.searchres{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:12px;background:var(--grad-soft),var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;text-align:left;width:100%;box-shadow:var(--sh-1)}
.res b{display:block;font-weight:600}
.res small{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-3);margin-left:auto;white-space:nowrap;letter-spacing:.02em}

/* Home */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--grad);color:var(--accent-ink);border-radius:26px;padding:20px;display:flex;gap:18px;align-items:center;box-shadow:0 20px 44px -18px rgb(var(--a2-rgb) / .8),inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 65%);z-index:-1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.10) 50%,rgba(255,255,255,0) 60%);background-size:250% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}
.hero h2{color:inherit;font-size:22px}
.hero p{margin:5px 0 0;opacity:.88;font-size:14.5px}
.ring{flex:none;width:76px;height:76px;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(255,255,255,.35))}
.ring svg circle:nth-child(2){stroke:var(--accent-ink)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.alert{display:flex;gap:12px;align-items:center;background:var(--sun-soft);border:1px solid rgba(255,181,71,.35);border-radius:var(--r);padding:14px;box-shadow:var(--hi)}
.alert b{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;background:var(--grad-soft),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px;min-width:0;box-shadow:var(--sh-1)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgb(var(--a-rgb) / .16),rgb(var(--a-rgb) / 0) 70%);pointer-events:none}
.tile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgb(var(--a-rgb) / .28),rgb(var(--a2-rgb) / .10));color:var(--accent-3);box-shadow:inset 0 0 0 1px rgb(var(--a3-rgb) / .22),0 6px 16px -8px rgb(var(--a2-rgb) / .8)}
.tile .ic svg{width:21px;height:21px}
.tile b{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--muted)}
.open-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.open-list li{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.open-list li:last-child{border-bottom:0;padding-bottom:0}

/* Aufgaben */
.daybar{display:flex;align-items:center;gap:8px}
.daybar h2{flex:1;text-align:center;font-size:20px}
.iconbtn{border:1px solid var(--line);background:var(--grad-soft),var(--surface);border-radius:13px;width:42px;height:42px;display:grid;place-items:center;color:var(--fg);box-shadow:var(--sh-1)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:19px;height:19px}
.slot{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:var(--grad-soft),var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 14px;transition:background .25s,border-color .25s,box-shadow .25s;box-shadow:var(--sh-1)}
.task.done{background:linear-gradient(135deg,rgb(var(--a2-rgb) / .20),rgb(var(--a-rgb) / .06));border-color:rgb(var(--a-rgb) / .28)}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line-2);background:rgba(255,255,255,.02);display:grid;place-items:center;padding:0;color:transparent}
.task.done .check{background:var(--grad);border-color:transparent;color:var(--accent-ink);box-shadow:0 4px 14px -4px rgb(var(--a2-rgb) / .9);animation:pop .35s var(--ease)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.check svg{width:17px;height:17px}
.task .txt{flex:1;min-width:0}
.task .txt b{display:block;font-weight:600}
.task.done .txt b{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:rgb(var(--a3-rgb) / .7);color:var(--muted)}
.task .who{font-size:13px;color:var(--muted)}
.task.done .who{color:var(--accent-3)}
.undo{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sun-soft);color:var(--sun);letter-spacing:.01em;box-shadow:inset 0 0 0 1px rgba(255,181,71,.25)}
.note{font-size:14px;color:var(--muted);background:rgb(var(--glass) / .6);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

/* Müll */
.bins{display:flex;flex-direction:column;gap:10px}
.bin{display:flex;align-items:center;gap:14px;background:var(--grad-soft),var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh-1)}
.can{flex:none;width:38px;height:44px;border-radius:6px 6px 10px 10px;position:relative;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.12) 45%,rgba(0,0,0,.2)),var(--c);box-shadow:0 6px 14px -6px rgba(0,0,0,.8)}
.can::before{content:"";position:absolute;left:-4px;right:-4px;top:-6px;height:8px;border-radius:4px;background:var(--c);filter:brightness(.8)}
.bin .txt{flex:1;min-width:0}
.bin .txt b{display:block}
.bin .when{font-family:var(--display);font-weight:800;font-size:18px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bin .when small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.soon{border-color:rgba(255,107,114,.35)}
.soon .when{color:var(--danger)}
.form{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.frow label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px;min-width:0}
.frow .lbl{grid-column:1/-1;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--fg)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.form input,.form select{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:10px 11px;min-width:0;width:100%;box-sizing:border-box;transition:border-color .2s,box-shadow .2s}
.btn{position:relative;border:0;background:var(--grad);color:var(--accent-ink);font-weight:700;border-radius:14px;padding:13px 18px;font-size:15.5px;letter-spacing:-.005em;box-shadow:var(--glow)}
.btn.ghost{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn:disabled{opacity:.45;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
a{color:var(--accent-3);font-weight:600;text-decoration-color:rgb(var(--a3-rgb) / .4);text-underline-offset:3px}

/* Familie */
.people{display:flex;flex-direction:column;gap:10px}
.person{display:flex;align-items:center;gap:14px;background:var(--grad-soft),var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh-1)}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px rgb(var(--a3-rgb) / .25),0 8px 18px -8px rgba(0,0,0,.9)}
.person .txt{flex:1;min-width:0}
.person .txt b{display:block;font-size:16.5px;font-weight:650}
.person .bd{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.person .bd strong{display:block;font-family:var(--display);font-size:18px;color:var(--fg);letter-spacing:-.02em}
.person.bday{border-color:rgba(255,181,71,.45);background:linear-gradient(135deg,rgba(255,181,71,.14),rgba(255,181,71,.03)),var(--surface)}

.chat{position:fixed;inset:0;z-index:25;background:radial-gradient(120% 50% at 50% -10%,rgb(var(--a2-rgb) / .18),rgb(var(--a2-rgb) / 0) 60%),var(--bg);display:flex;flex-direction:column;height:100dvh;animation:up .3s var(--ease)}

.chathead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:rgb(var(--glass) / .75);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}

.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%;animation:msgin .28s var(--ease)}

.msg.me{justify-content:flex-end}

.msg.ai .bub{background:var(--grad-soft),var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;max-width:calc(100% - 40px);box-shadow:var(--sh-1)}

@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.chatintro{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 4px}

.chatbar{display:flex;align-items:flex-end;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:rgb(var(--glass) / .85);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}

.aisrc{margin:8px 0 0!important;font-size:12px;color:var(--muted)}.aisrc a{color:var(--accent-3);text-decoration:none}

.aiacts{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}.aiacts li{background:var(--accent-soft);border:1px solid rgb(var(--a-rgb) / .3);border-radius:12px;padding:7px 11px;font-size:13.5px;font-weight:600}
.aiconf{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.aiconfd{margin:8px 0 0}
.aisteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.ai{border-color:rgb(var(--a-rgb) / .45);box-shadow:var(--sh-1),0 0 0 1px rgb(var(--a-rgb) / .12),0 16px 36px -20px rgb(var(--a2-rgb) / .7)}
.aihead{display:flex;align-items:center;gap:8px;font-weight:800;font-family:var(--display);font-size:15px;color:var(--accent-3);margin-bottom:8px;letter-spacing:-.01em}

.ailist li small{display:block;color:var(--muted)}
.aibtn{flex:none;border:0;border-radius:99px;background:var(--grad);color:var(--accent-ink);font-weight:700;font-size:13px;padding:7px 13px;box-shadow:0 4px 12px -4px rgb(var(--a2-rgb) / .8)}
.aibtn.ghost{background:var(--surface);color:var(--accent-3);border:1px solid var(--line-2);box-shadow:none}
.askchips{display:flex;gap:8px}
.askchips .chip{flex:none;font-size:14px;padding:8px 14px;white-space:nowrap}
.wxc.now{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgb(var(--a-rgb) / .3)}

/* Familie: Einstellungen */

/* Einkauf */
.shop-add{display:flex;gap:8px}

.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--grad-soft),var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 8px 10px 14px;box-shadow:var(--sh-1);transition:background .25s,opacity .25s}

.del{border:0;background:none;color:var(--danger);font-size:14px;font-weight:700;padding:8px 10px;border-radius:10px}

.rank .pos{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.rank li:first-child .pos{color:var(--sun);text-shadow:0 0 12px rgba(255,181,71,.6)}
.rank .bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.rank .bar i{display:block;height:100%;background:var(--grad);border-radius:99px;box-shadow:0 0 12px rgb(var(--a-rgb) / .6)}
.rank .pts{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.addtask{border:1.5px dashed var(--line-2);background:rgb(var(--a-rgb) / .03);border-radius:18px;padding:13px;font-weight:700;color:var(--accent-3);width:100%}
.sheet select{border:1px solid var(--line);background:var(--bg-2);border-radius:12px;padding:12px;width:100%;box-sizing:border-box;font-size:16px}
.chips.days .chip{padding:8px 12px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.tfield{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}

/* Kalender */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--hi)}

.daylabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0}

.agenda{display:flex;flex-direction:column;gap:14px}

(function swipe(){
  const vp=$('#vp');let sx=0,sy=0,dx=0,mode=null;
  vp.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||e.target.closest('input,select,textarea,.hscroll')){mode='off';return}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;mode=null;
  },{passive:true});
  vp.addEventListener('touchmove',e=>{
    if(mode==='off')return;
    const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
    if(mode===null){if(Math.abs(x)>10&&Math.abs(x)>Math.abs(y)*1.2){mode='h';track.classList.add('drag')}else if(Math.abs(y)>10){mode='off';return}else return}
    dx=x;
    let edge=(S.page===0&&dx>0)||(S.page===PAGES.length-1&&dx<0)?0.3:1;
    track.style.transform='translateX(calc('+(-S.page*100/PAGES.length)+'% + '+(dx*edge/PAGES.length)+'px))';
  },{passive:true});
  vp.addEventListener('touchend',()=>{
    if(mode==='h'){track.classList.remove('drag');const w=vp.clientWidth;if(dx<-w*0.18)go(S.page+1);else if(dx>w*0.18)go(S.page-1);else go(S.page)}
    mode=null;
  });

/* ---------- Data ---------- */
function isDone(d,t){return S.done[key(d)+'_'+t.id]}
/* Listed dates (from the AWSH calendar, holiday shifts included) win; after the last one the rhythm continues from the regular anchor date. */
function nextPickup(bin,from){
  const cfg=S.muell&&S.muell[bin.id];if(!cfg)return null;
  const dates=(Array.isArray(cfg.dates)?cfg.dates:[]).slice().sort();
  const listed=dates.find(k=>parse(k)>=from);
  if(listed)return parse(listed);
  if(!cfg.start)return null;
  const d=parse(cfg.start),step=(+cfg.weeks||bin.w)*7;
  let floor=from;const last=dates[dates.length-1];
  // half a cycle past the last listed date, so a holiday-shifted date isn't followed by its original slot
  if(last&&addDays(parse(last),Math.ceil(step/2))>floor)floor=addDays(parse(last),Math.ceil(step/2));
  if(d>=floor)return d;
  const n=Math.ceil(diffDays(d,floor)/step);return addDays(d,n*step);
}
function nextPickups(bin,from,count){
  const out=[];let f=from;
  for(let i=0;i<count;i++){const d=nextPickup(bin,f);if(!d)break;out.push(d);f=addDays(d,1)}
  return out;
}
function upcoming(){
  const t=today();
  return BINS.map(b=>({b,d:nextPickup(b,t)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
}
function nextBirthday(p){
  const t=today(),b=parse(p.b);let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());
  if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());
  return {date:n,days:diffDays(t,n),turns:n.getFullYear()-b.getFullYear()};
}
function age(p){const t=today(),b=parse(p.b);let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a}

function searchResults(qq){
  const q=qq.toLowerCase(),t=today(),res=[];
  allTasks().forEach(x=>{if((x.t+' '+x.k+' '+x.slot+' '+daysLabel(x)+' '+(x.who||'')).toLowerCase().includes(q)){const d=isDone(t,x);res.push({go:0,title:x.t,sub:SLOTS.find(s=>s[0]===x.slot)[1]+(x.days?' · '+daysLabel(x):'')+(x.once?' · einmalig am '+fmtShort(parse(x.once)):'')+(x.due?' · bis '+x.due+' Uhr':'')+(x.who?' · für '+x.who:'')+(d?' · erledigt von '+d.name:''),tag:'Aufgabe'})}});
  BELLA_TASKS.forEach(x=>{if((x.t+' '+x.slot+' bella hund').toLowerCase().includes(q)){const d=isDone(t,x);res.push({go:PG.bella,title:x.t,sub:(x.slot==='morgens'?'Morgens':'Abends')+(d?' · erledigt von '+d.name:' · noch offen'),tag:'Bella'})}});
  S.shop.forEach(x=>{if(String(x.text).toLowerCase().includes(q))res.push({go:PG.einkauf,title:x.text,sub:(x.done?'Gekauft':'Auf der Einkaufsliste')+(x.by?' · von '+x.by:''),tag:'Einkauf'})});
  S.pkgs.forEach(p=>{if((pkgTitle(p)+' '+carrierOf(p).n+' '+(p.nr||'')+' paket sendung').toLowerCase().includes(q)){const st=pkgState(p);res.push({go:PG.einkauf,tab:'pakete',title:pkgTitle(p),sub:carrierOf(p).n+' · '+(st==='da'?'Angekommen':st==='heute'?'Kommt heute':st==='zugestellt'?'Zugestellt':'Unterwegs'),tag:'Paket'})}});
  if('pakete paket sendungsverfolgung'.includes(q))res.push({go:PG.einkauf,tab:'pakete',title:'Pakete',sub:S.pkgs.filter(p=>pkgState(p)!=='da').length+' unterwegs',tag:'Pakete'});
  S.notes.forEach(n=>{if((n.text+' '+(n.by||'')+' pinnwand notiz').toLowerCase().includes(q))res.push({go:PG.familie,tab:'pinnwand',title:String(n.text).slice(0,60),sub:'Pinnwand'+(n.by?' · von '+n.by:''),tag:'Pinnwand'})});
  Object.values(S.meals).forEach(m=>{if((m.text+' '+(m.items||[]).join(' ')+' essen kochen').toLowerCase().includes(q))res.push({go:PG.einkauf,tab:'essen',title:m.text,sub:fmtShort(parse(m.date))+(m.cook?' · kocht: '+m.cook:''),tag:'Essen'})});
  if('essensplan essen kochen'.includes(q))res.push({go:PG.einkauf,tab:'essen',title:'Essensplan',sub:'Was gibt es diese Woche?',tag:'Essen'});
  if('pinnwand notizen nachrichten'.includes(q))res.push({go:PG.familie,tab:'pinnwand',title:'Pinnwand',sub:S.notes.length+' Nachrichten',tag:'Pinnwand'});
  if('einkaufsliste einkaufen'.includes(q))res.push({go:PG.einkauf,title:'Einkaufsliste',sub:S.shop.filter(x=>!x.done).length+' offen',tag:'Einkauf'});
  S.events.forEach(e=>{if((e.title+' '+(e.place||'')+' '+(e.persons||[]).join(' ')+' '+(e.desc||'')+' termin kalender').toLowerCase().includes(q)){const d=parse(e.date);res.push({go:1,tab:'termine',day:e.date,title:e.title,sub:fmtShort(d)+(evMulti(e)?' – '+fmtShort(parse(evEnd(e))):'')+(d.getFullYear()!==t.getFullYear()?' '+d.getFullYear():'')+(e.time?' · '+e.time+' Uhr':'')+(e.place?' · '+e.place:''),tag:'Termin'})}});
  bdaysAll().forEach(b=>{if((b.name+' geburtstag').toLowerCase().includes(q))res.push({go:1,tab:'geburtstage',title:b.name,sub:'Geburtstag am '+bdLabel(b),tag:'Geburtstag'})});
  if('kalender termine'.includes(q))res.push({go:1,tab:'termine',title:'Kalender',sub:'Termine, Geburtstage und Müll',tag:'Kalender'});
  if('punkte rangliste'.includes(q))res.push({go:PG.familie,title:'Wochen-Rangliste',sub:'Wer hat diese Woche am meisten gemacht?',tag:'Familie'});
  BINS.forEach(b=>{if((b.n+' '+b.sub+' müll tonne abfuhr').toLowerCase().includes(q)){const d=nextPickup(b,t);res.push({go:1,tab:'muell',title:b.n,sub:d?fmtShort(d)+' ('+relDay(diffDays(t,d))+')':'Noch kein Termin eingetragen',tag:'Müll'})}});
  FAMILY.forEach(p=>{if((p.n+' '+p.role+' geburtstag').toLowerCase().includes(q)){const nb=nextBirthday(p);res.push({go:PG.kalender,tab:'geburtstage',title:p.n,sub:p.role+' · Geburtstag '+fmtShort(nb.date),tag:'Familie'})}});
  return res;
}

/* ---------- Kalender ---------- */
const MAXY=10;
function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0}
function bdaysAll(){return S.bdaysLoaded?S.bdays:FAMILY.map(p=>({id:'f-'+p.n,name:p.n,date:p.b}))}
/* Geburtstage: date ist "JJJJ-MM-TT", "0000-MM-TT" wenn das Jahr unbekannt ist */
function bdParts(b){const a=String(b.date).split('-').map(Number);return {y:a[0]||null,m:a[1]-1,d:a[2]}}
function bdLabel(b){const p=bdParts(b);return p.d+'. '+MO[p.m]+(p.y?' '+p.y:'')}
function bdAge(b,year){const p=bdParts(b);return p.y?year-p.y:null}
function bdNext(b){const t=today(),p=bdParts(b);let day=p.d;const mk=y=>new Date(y,p.m,p.m===1&&day===29&&!isLeap(y)?28:day);let n=mk(t.getFullYear());if(n<t)n=mk(t.getFullYear()+1);return n}
function bdayOn(b,d){const p=bdParts(b);if(p.m!==d.getMonth()||(p.y&&d.getFullYear()<p.y))return false;let day=p.d;if(p.m===1&&day===29&&!isLeap(d.getFullYear()))day=28;return day===d.getDate()}
function bdFields(pre,b,dis){
  const p=b?bdParts(b):{y:null,m:-1,d:0},x=dis?' disabled':'';
  return '<div class="bdf"><label class="f">Tag<select id="'+pre+'D"'+x+'><option value="">–</option>'+Array.from({length:31},(_,i)=>'<option'+(p.d===i+1?' selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label>'+
    '<label class="f">Monat<select id="'+pre+'M"'+x+'><option value="">–</option>'+MO.map((m,i)=>'<option value="'+i+'"'+(p.m===i?' selected':'')+'>'+m+'</option>').join('')+'</select></label>'+
    '<label class="f">Jahr (optional)<input id="'+pre+'Y" inputmode="numeric" maxlength="4" placeholder="z. B. 1960" value="'+(p.y||'')+'"'+x+'></label></div>';
}
function bdRead(pre){
  const d=+$('#'+pre+'D').value,mv=$('#'+pre+'M').value,ys=$('#'+pre+'Y').value.trim();
  if(!d||mv===''){toast('Bitte Tag und Monat wählen');return null}
  const m=+mv,maxD=[31,29,31,30,31,30,31,31,30,31,30,31][m];
  if(d>maxD){toast('Den '+d+'. '+MO[m]+' gibt es nicht');return null}
  let y=0;
  if(ys){y=+ys;if(!/^\d{4}$/.test(ys)||y<1900||y>today().getFullYear()){toast('Jahr bitte vierstellig, z. B. 1960, oder leer lassen');return null}
    if(m===1&&d===29&&!isLeap(y)){toast(y+' hatte keinen 29. Februar');return null}}
  return String(y).padStart(4,'0')+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
/* Mehrtägige Termine: e.endDate (optional) ist der letzte Tag. Ohne endDate ist der Termin eintägig. */
function evEnd(e){return /^\d{4}-\d\d-\d\d$/.test(e.endDate||'')&&e.endDate>e.date?e.endDate:e.date}
function evOn(e,k){return e.date<=k&&k<=evEnd(e)}
function evMulti(e){return evEnd(e)!==e.date}
function evSpan(e,k){if(!evMulti(e))return '';const n=diffDays(parse(e.date),parse(evEnd(e)))+1,i=diffDays(parse(e.date),parse(k))+1;return 'Tag '+i+' von '+n+' · '+(k===e.date?'bis '+fmtShort(parse(evEnd(e))):'seit '+fmtShort(parse(e.date)))}
function evRange(e){return evMulti(e)?longDate(parse(e.date))+' bis '+longDate(parse(evEnd(e))):longDate(parse(e.date))}
function itemsOn(d){
  const k=key(d),out=[];
  S.events.filter(e=>evOn(e,k)).forEach(e=>{const first=k===e.date;out.push({kind:'ev',e,k,time:first?e.time||'':''})});
  bdaysAll().filter(b=>bdayOn(b,d)).forEach(b=>out.push({kind:'bd',b,time:'',age:bdAge(b,d.getFullYear())}));
  BINS.forEach(bin=>{const p=nextPickup(bin,d);if(p&&key(p)===k)out.push({kind:'muell',bin,time:''})});
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
function longDate(d){return WD[d.getDay()]+', '+d.getDate()+'. '+MO[d.getMonth()]+' '+d.getFullYear()}
function evRow(it){
  if(it.kind==='ev'){const e=it.e,first=!it.k||it.k===e.date,sp=it.k?evSpan(e,it.k):'';return '<button class="ev" data-ev="'+esc(e.id)+'"><span class="tm">'+(e.time&&first?esc(e.time):'<small>'+(evMulti(e)?'mehrtägig':'ganztägig')+'</small>')+'</span><span class="txt"><b>'+esc(e.title)+'</b>'+(sp?'<span>'+esc(sp)+'</span>':'')+(e.place?'<span>Ort: '+esc(e.place)+'</span>':'')+(e.persons&&e.persons.length?'<span>Mit: '+esc(e.persons.join(', '))+'</span>':'')+'</span></button>'}
  if(it.kind==='bd')return '<button class="ev bd" data-bd="'+esc(it.b.id)+'"><span class="tm">🎂</span><span class="txt"><b>'+esc(it.b.name)+' hat Geburtstag</b>'+(it.age>0?'<span>wird '+it.age+'</span>':'')+'</span></button>';
  return '<button class="ev" data-muell="1"><span class="tm"><span class="can" style="--c:'+it.bin.c+';width:18px;height:22px;display:block;margin:4px 0 0 6px"></span></span><span class="txt"><b>'+it.bin.n+'</b><span>Müllabfuhr · Tonne am Vorabend rausstellen</span></span></button>';
}

function renderTermine(){
  const box=$('#calTermine'),t=today(),m=S.calMonth,y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),start=addDays(first,-((first.getDay()+6)%7));
  const minM=new Date(t.getFullYear()-1,t.getMonth(),1),maxM=new Date(t.getFullYear()+MAXY,t.getMonth(),1);
  let g='<div class="cal">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>'<span class="wd">'+w+'</span>').join('');
  for(let i=0;i<42;i++){
    const d=addDays(start,i);if(i===35&&d.getMonth()!==mo)break;
    const k=key(d),its=itemsOn(d);
    const dots=[...new Set(its.map(x=>x.kind))].map(kd=>'<i style="--c:'+(kd==='ev'?'var(--accent)':kd==='bd'?'var(--sun)':'var(--muted)')+'"></i>').join('');
    g+='<button class="'+(d.getMonth()!==mo?'out ':'')+(k===key(t)?'today':'')+'" data-day="'+k+'" aria-pressed="'+(k===S.calSel)+'" aria-label="'+d.getDate()+'. '+MO[d.getMonth()]+(its.length?', '+its.length+(its.length===1?' Eintrag':' Einträge'):'')+'">'+d.getDate()+'<span class="dots2">'+dots+'</span></button>';
  }
  g+='</div>';
  const sel=parse(S.calSel),its=itemsOn(sel),atToday=S.calSel===key(t)&&y===t.getFullYear()&&mo===t.getMonth();
  let html='<div class="monthbar"><button class="iconbtn" id="mPrev" aria-label="Monat zurück" '+(m<=minM?'disabled':'')+'>'+ICON.left+'</button><h2>'+MO[mo]+' '+y+'</h2><button class="iconbtn" id="mNext" aria-label="Monat vor" '+(m>=maxM?'disabled':'')+'>'+ICON.right+'</button></div>'+g;
  html+='<div class="row" style="justify-content:space-between;align-items:center;min-height:34px"><p class="daylabel">'+relDay(diffDays(t,sel))+' · '+fmtShort(sel)+(y!==t.getFullYear()?' '+sel.getFullYear():'')+'</p>'+(atToday?'':'<button class="undo" id="calToday">Zu heute</button>')+'</div>';
  html+=its.length?'<div class="evlist">'+its.map(evRow).join('')+'</div>':'<p class="small muted" style="margin:0">Keine Termine an diesem Tag.</p>';
  if(S.canWrite)html+='<button class="addtask" id="addEv">+ Termin hinzufügen</button>';
  else html+=statusNote();
  html+='<div class="sub"><h3 style="margin:0">Liste ab heute</h3><div class="agenda" id="agenda"></div><div class="agmore" id="agMore"></div></div>';
  box.innerHTML=html;
  $('#mPrev').onclick=()=>{S.calMonth=new Date(y,mo-1,1);renderTermine()};
  $('#mNext').onclick=()=>{S.calMonth=new Date(y,mo+1,1);renderTermine()};
  const ct=$('#calToday');if(ct)ct.onclick=()=>{S.calSel=key(t);S.calMonth=new Date(t.getFullYear(),t.getMonth(),1);renderTermine()};
  box.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{S.calSel=b.dataset.day;const d=parse(S.calSel);if(d.getMonth()!==mo)S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);renderTermine()}));
  bindItems(box);
  const ae=$('#addEv');if(ae)ae.onclick=()=>openEventSheet(null,S.calSel);
  renderAgenda();
}

function isoWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
function agBlock(it){
  if(it.kind==='ev'){const e=it.e,first=!it.k||it.k===e.date,sp=it.k?evSpan(e,it.k):'';return '<button class="agb" style="--c:var(--accent)" data-ev="'+esc(e.id)+'"><b>'+esc(e.title)+'</b>'+(sp?'<span>'+esc(sp)+'</span>':'')+'<span>'+(e.time&&first?esc(e.time)+' Uhr':'Ganztägig')+(e.place?' · '+esc(e.place):'')+'</span><span>'+(e.persons&&e.persons.length?'Mit '+esc(e.persons.join(', ')):'Für alle')+'</span></button>'}

  return '<button class="agb" style="--c:'+it.bin.c+'" data-muell="1"><b>'+it.bin.n+'</b><span>Müllabfuhr · Am Heeschberg 6</span><span>Tonne am Vorabend rausstellen</span></button>';
}
/* Tagesliste ab heute, lädt beim Scrollen weitere Tage nach (bis 10 Jahre) */
function renderAgenda(){
  const box=$('#agenda'),more=$('#agMore');if(!box)return;
  const t=today(),cap=diffDays(t,new Date(t.getFullYear()+MAXY,t.getMonth()+1,0));
  const n=Math.min(S.agDays,cap);let html='',lastWeek=null;
  for(let i=0;i<=n;i++){
    const d=addDays(t,i),its=itemsOn(d);
    if(!its.length&&i>0)continue;
    const w=isoWeek(d);
    if(w!==lastWeek&&lastWeek!==null)html+='<p class="agweek">KW '+w+(d.getFullYear()!==t.getFullYear()?' · '+d.getFullYear():'')+'</p>';
    lastWeek=w;
    html+='<div class="agday'+(i===0?' is-today':'')+'"><div class="agdate"><small>'+WD[d.getDay()].slice(0,2)+'.</small><b>'+d.getDate()+'</b>'+'<small class="agmon">'+(MO[d.getMonth()].length>4?MO[d.getMonth()].slice(0,3).toLowerCase()+'.':MO[d.getMonth()].toLowerCase())+'</small>'+'</div><div class="agitems">'+(its.length?its.map(agBlock).join(''):'<div class="agb empty" style="--c:var(--line)"><span>Heute nichts eingetragen</span></div>')+'</div></div>';
  }
  box.innerHTML=html;
  bindItems(box);
  const done=n>=cap;
  more.textContent=done?'Ende der Liste: 10 Jahre im Voraus':'Weitere Tage werden geladen …';
  if(S.agObs)S.agObs.disconnect();S.agObs=null;
  if(!done&&'IntersectionObserver' in window){
    S.agObs=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){S.agObs.disconnect();S.agDays+=90;renderAgenda()}},{rootMargin:'400px'});
    S.agObs.observe(more);
  }
}
function renderGeb(){
  const t=today();
  const list=bdaysAll().map(b=>{const n=bdNext(b);return {b,n,days:diffDays(t,n),turns:bdAge(b,n.getFullYear())}}).sort((a,b)=>a.days-b.days);
  let html='<p class="small muted" style="margin:0">Geburtstage stehen jedes Jahr automatisch im Kalender.</p>'+statusNote();
  html+=list.length?'<div class="evlist">'+list.map(x=>'<div class="ev bd"><span class="tm">🎂</span><span class="txt"'+(S.canWrite&&S.bdaysLoaded?' data-bd="'+esc(x.b.id)+'" role="button" tabindex="0" style="cursor:pointer"':'')+'><b>'+esc(x.b.name)+'</b><span>'+bdLabel(x.b)+(x.turns?' · wird '+x.turns:'')+' · '+(x.days===0?'heute!':relDay(x.days))+'</span></span>'+(S.canWrite&&S.bdaysLoaded?'<button class="del" data-bdel="'+esc(x.b.id)+'" aria-label="'+esc(x.b.name)+' löschen">✕</button>':'')+'</div>').join('')+'</div>':'<p class="small muted" style="margin:0">Noch keine Geburtstage eingetragen.</p>';

/* Push-Erinnerungen vor einem Termin, in Minuten. Ohne Uhrzeit zählt 9 Uhr. */
const REMIND_OPTS=[[10080,'1 Woche'],[2880,'2 Tage'],[1440,'24 Std'],[120,'2 Std'],[60,'1 Std'],[30,'30 Min'],[15,'15 Min']];
const REMIND_DEFAULT=[1440,120,30];
function remindOf(e){return Array.isArray(e.remind)?e.remind:REMIND_DEFAULT}
function remindLabel(e){const r=remindOf(e);return r.length?REMIND_OPTS.filter(o=>r.includes(o[0])).map(o=>o[1]).join(', ')+' vorher':'Keine Erinnerung'}
function openEventSheet(ev,dateKey,pre){

    '<div class="two"><label class="f">Uhrzeit (Beginn)<input type="time" id="eTime" value="'+esc(e.time||'')+'"></label></div>'+
    '<p class="small muted" style="margin:-4px 0 0">Für einen Tag einfach Von und Bis gleich lassen.</p>'+

    '<div><h3>Erinnerung per Push</h3><div class="chips">'+REMIND_OPTS.map(o=>'<button type="button" class="chip" data-r="'+o[0]+'" aria-pressed="'+rem.has(o[0])+'">'+o[1]+'</button>').join('')+'</div><p class="small muted" style="margin:6px 0 0" id="remHint"></p></div>'+

  const hint=()=>{$('#remHint').textContent=!rem.size?'Keine Push-Erinnerung für diesen Termin.':$('#eTime').value?'':'Ohne Uhrzeit wird von 9 Uhr aus gerechnet.'};
  host.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{const m=+b.dataset.r;rem.has(m)?rem.delete(m):rem.add(m);b.setAttribute('aria-pressed',rem.has(m));hint()}));
  $('#eTime').addEventListener('input',hint);hint();
  let prevStart=$('#eDate').value;
  $('#eDate').addEventListener('change',()=>{const s=$('#eDate').value,en=$('#eEnd');if(!s)return;
    /* Bis-Datum mitschieben, damit die Dauer gleich bleibt */

    if(!en.value||en.value<s)en.value=s;

    let end=$('#eEnd').value||date;
    if(!/^\d{4}-\d\d-\d\d$/.test(end)||end>maxK){$('#eEnd').focus();toast('Bitte ein gültiges Bis-Datum wählen');return}
    if(end<date){$('#eEnd').focus();toast('Das Bis-Datum liegt vor dem Von-Datum');return}
    const data={title,place:$('#ePlace').value.trim(),date,time:/^\d\d:\d\d$/.test(time)?time:'',persons:FAMILY.map(p=>p.n).filter(n=>ppl.has(n)),desc:$('#eDesc').value.trim(),remind:[...rem].sort((a,b)=>b-a),at:e.at||Date.now(),by:e.by||S.name||''};
    if(end>date)data.endDate=end;
    if(!S.db)return;

    try{
      if(ev)await S.db.collection('events').doc(ev.id).set(data);else await S.db.collection('events').add(data);
      S.calSel=date;const d=parse(date);S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);renderCal();
      toast(ev?'Termin geändert':'Termin eingetragen');
    }catch(err){handleWriteError(err)}
  });
}

/* ---------- Zeiten: Stundenplan & Arbeitszeiten ---------- */
const WDN=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function nowHM(d){d=d||new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function shortT(t){return t?t.replace(/^0/,'').replace(/:00$/,''):''}
function schedDay(n,wd){const s=S.sched[n];return s&&s.days&&s.days[wd]||null}
function personColor(n){const p=FAMILY.find(x=>x.n===n);return p?p.c:'var(--muted)'}
/* Wo ist jemand zu einem Zeitpunkt? home: true = zuhause, false = unterwegs, null = unbekannt */
function whereIs(n,at){
  at=at||new Date();const wd=at.getDay(),pp=SCHED_PEOPLE.find(x=>x.n===n),school=pp&&pp.kind==='school';
  if(wd===0||wd===6)return {home:true,txt:'Wochenende'};
  const d=schedDay(n,wd);
  if(!d||(!d.off&&(!d.from||!d.to)))return {home:null,txt:'Keine Zeiten eingetragen'};
  if(d.off)return {home:true,txt:'Heute frei'};
  const m=nowHM(at);
  if(d.ho)return m>=d.from&&m<d.to?{home:true,ho:true,txt:'Homeoffice bis '+shortT(d.to)+' Uhr'}:{home:true,txt:m<d.from?'Homeoffice ab '+shortT(d.from)+' Uhr':'Feierabend'};
  if(m<d.from)return {home:true,txt:(school?'Schule':'Arbeit')+' ab '+shortT(d.from)+' Uhr'};
  if(m<d.to)return {home:false,txt:(school?'In der Schule':'Auf der Arbeit')+' bis '+shortT(d.to)+' Uhr'};
  return {home:true,txt:school?'Schule ist vorbei':'Feierabend'};
}
function homeSummary(){
  const st=SCHED_PEOPLE.map(p=>({n:p.n,w:whereIs(p.n)}));
  if(st.every(x=>x.w.home===null))return 'Zeiten eintragen';
  const h=st.filter(x=>x.w.home).map(x=>x.n);
  return h.length===st.length?'Alle zuhause':h.length?'Zuhause: '+h.join(', '):'Gerade niemand';
}

    (S.canWrite?'<div class="chips" style="margin-top:12px">'+SCHED_PEOPLE.map(p=>'<button class="chip" data-sched="'+p.n+'">'+p.n+(p.kind==='school'?': Stundenplan':': Arbeitszeiten')+'</button>').join('')+'</div>':'')+'</div>';

/* ---------- Frag Frahm: Assistent, läuft komplett im Handy ----------
   Versteht Fragen zu freien Zeiten, Terminen, Wetter, Müll, Geburtstagen, wer zuhause ist,
   Aufgaben, Bella und Einkauf, und kann Termine eintragen. */
const AI_WD={sonntag:0,montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6};
const AI_MON={januar:0,februar:1,'märz':2,maerz:2,april:3,mai:4,juni:5,juli:6,august:7,september:8,oktober:9,november:10,dezember:11,jan:0,feb:1,apr:3,jun:5,jul:6,aug:7,sep:8,sept:8,okt:9,nov:10,dez:11};
const AI_MONRE='(januar|februar|märz|maerz|april|mai|juni|juli|august|september|oktober|november|dezember|jan|feb|apr|jun|jul|aug|sept|sep|okt|nov|dez)';
const HUMANS=()=>FAMILY.filter(p=>!p.dog).map(p=>p.n);
function aiFmt(d){return WDS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'}
function aiYear(m,d){const t=today();let y=t.getFullYear();if(new Date(y,m,d)<t)y++;return y}
/* Findet das erste Datum im Text. Gibt {d, i, len} zurück. */
function aiDate(str){
  const t=today(),c=[];let m;
  const add=(re,fn)=>{re.lastIndex=0;const x=re.exec(str);if(x){const d=fn(x);if(d&&!isNaN(d))c.push({d,i:x.index,len:x[0].length})}};
  add(/\bübermorgen\b/i,()=>addDays(t,2));
  add(/(?<!über)\bmorgen\b(?!s)/i,()=>addDays(t,1));
  add(/\bheute\b/i,()=>t);
  add(/\bin\s+(\d+|einem|zwei|drei)\s+tag(en)?\b/i,x=>addDays(t,{einem:1,zwei:2,drei:3}[x[1].toLowerCase()]||+x[1]));
  add(/\bin\s+(einer|\d+|zwei)\s+woche(n)?\b/i,x=>addDays(t,7*({einer:1,zwei:2}[x[1].toLowerCase()]||+x[1])));
  add(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/,x=>{const y=x[3]?(x[3].length===2?2000+ +x[3]:+x[3]):aiYear(+x[2]-1,+x[1]);const d=new Date(y,+x[2]-1,+x[1]);return d.getMonth()===+x[2]-1?d:null});
  add(new RegExp('\\b(\\d{1,2})\\.?\\s*'+AI_MONRE+'\\b\\.?(\\s+(\\d{4}))?','i'),x=>{const mo=AI_MON[x[2].toLowerCase()];const y=x[4]?+x[4]:aiYear(mo,+x[1]);return new Date(y,mo,+x[1])});
  add(/\b(?:am\s+)?(nächsten|nächster|kommenden|diesen|übernächsten)?\s*(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b/i,x=>{const wd=AI_WD[x[2].toLowerCase()],pre=(x[1]||'').toLowerCase();let n=(wd-t.getDay()+7)%7;if(pre.startsWith('nächst')&&n===0)n=7;if(pre==='übernächsten')n+=7;return addDays(t,n)});
  c.sort((a,b)=>a.i-b.i);return c[0]||null;
}
/* Zeitraum für Fragen wie „nächste Woche“, „im November“, „zwischen 1.11. und 10.11.“ */
function aiRange(str){
  const t=today(),l=str.toLowerCase();let m;
  if((m=/(?:zwischen|vom|von)\s+(.+?)\s+(?:und|bis)\s+(.+)$/i.exec(str))){const a=aiDate(m[1]),b=aiDate(m[2]);if(a&&b&&b.d>=a.d)return {from:a.d,to:b.d,label:'vom '+aiFmt(a.d)+' bis '+aiFmt(b.d)}}
  if((m=/\bbis\s+(.+)$/i.exec(str))){const b=aiDate(m[1]);if(b&&b.d>=t)return {from:t,to:b.d,label:'bis '+aiFmt(b.d)}}
  if(/übernächste[nr]?\s+woche/.test(l)){const mo=addDays(t,((8-t.getDay())%7||7)+7);return {from:mo,to:addDays(mo,6),label:'übernächste Woche'}}
  if(/nächste[nr]?\s+woche|kommende[nr]?\s+woche/.test(l)){const mo=addDays(t,(8-t.getDay())%7||7);return {from:mo,to:addDays(mo,6),label:'nächste Woche'}}
  if(/diese[rn]?\s+woche|die\s+woche\b/.test(l)){return {from:t,to:addDays(t,(7-t.getDay())%7),label:'diese Woche'}}
  if(/wochenende/.test(l)){const wd=t.getDay();let sat=wd===6?t:wd===0?addDays(t,-1):addDays(t,6-wd);if(/nächste[sn]?\s+wochenende/.test(l)&&(wd===6||wd===0))sat=addDays(sat,7);const from=sat<t?t:sat;return {from,to:addDays(sat,1),label:(from.getTime()===t.getTime()?'dieses':'am')+' Wochenende'}}
  if((m=/(?:die\s+)?nächsten\s+(\d+)\s+tage/.exec(l)))return {from:t,to:addDays(t,+m[1]-1),label:'die nächsten '+m[1]+' Tage'};
  if((m=/(?:die\s+)?nächsten\s+(\d+)\s+wochen/.exec(l)))return {from:t,to:addDays(t,7*m[1]-1),label:'die nächsten '+m[1]+' Wochen'};
  if(/diese[nm]?\s+monat/.test(l))return {from:t,to:new Date(t.getFullYear(),t.getMonth()+1,0),label:'diesen Monat'};
  if(/nächste[nm]?\s+monat/.test(l)){const a=new Date(t.getFullYear(),t.getMonth()+1,1);return {from:a,to:new Date(a.getFullYear(),a.getMonth()+1,0),label:MO[a.getMonth()]}}
  if((m=new RegExp('\\b(?:im|in|ende|anfang)?\\s*'+AI_MONRE+'\\b(?!\\s*\\d)','i').exec(str))&&!/\d\.?\s*$/.test(str.slice(0,m.index))){const mo=AI_MON[m[1].toLowerCase()];let y=t.getFullYear();if(mo<t.getMonth())y++;let a=new Date(y,mo,1);if(a<t)a=t;return {from:a,to:new Date(y,mo+1,0),label:'im '+MO[mo]}}
  const d=aiDate(str);if(d)return {from:d.d,to:d.d,label:d.d.getTime()===t.getTime()?'heute':d.d.getTime()===addDays(t,1).getTime()?'morgen':'am '+aiFmt(d.d),single:true};
  return null;
}
function aiTime(str){
  let m;
  if((m=/\bhalb\s+(\d{1,2})\b/i.exec(str))){const h=(+m[1]+23)%24;return {v:String(h).padStart(2,'0')+':30',i:m.index,len:m[0].length}}
  if((m=/\b(?:um\s*)?([01]?\d|2[0-3])[:.]([0-5]\d)\s*(?:uhr)?(?![.\d])/i.exec(str)))return {v:m[1].padStart(2,'0')+':'+m[2],i:m.index,len:m[0].length};
  if((m=/\b(?:um|ab|gegen)\s*([01]?\d|2[0-3])\s*(?:uhr)?\b/i.exec(str))||(m=/\b([01]?\d|2[0-3])\s*uhr\b/i.exec(str)))return {v:m[1].padStart(2,'0')+':00',i:m.index,len:m[0].length};
  return null;
}
function aiPersons(str){
  const l=str.toLowerCase(),out=HUMANS().filter(n=>new RegExp('\\b'+n.toLowerCase()+'\\b').test(l));
  if(/\b(ich|mich|mir|mein)\b/.test(l)&&S.name&&!out.includes(S.name))out.push(S.name);
  return out;
}
const hm2m=t=>{const [h,m]=t.split(':').map(Number);return h*60+m},m2hm=v=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
/* Freie Zeitfenster eines Tages zwischen 8 und 21 Uhr, für die genannten Personen */
function aiFree(d,persons){
  const k=key(d),busy=[],notes=[];
  S.events.filter(e=>evOn(e,k)&&(!e.persons||!e.persons.length||e.persons.some(p=>persons.includes(p)))).forEach(e=>{if(e.time&&e.date===k){const a=hm2m(e.time);busy.push([a,a+90,e.title])}else notes.push(e.title)});
  const wd=d.getDay();
  if(wd>=1&&wd<=5)persons.forEach(n=>{const x=schedDay(n,wd);if(x&&!x.off&&x.from&&x.to)busy.push([hm2m(x.from),hm2m(x.to),n+(SCHED_PEOPLE.find(p=>p.n===n&&p.kind==='school')?' Schule':' Arbeit')])});
  busy.sort((a,b)=>a[0]-b[0]);
  const free=[];let cur=8*60;
  if(k===key(today())){const n=new Date();cur=Math.max(cur,Math.ceil((n.getHours()*60+n.getMinutes())/30)*30)}
  busy.forEach(b=>{if(b[0]>cur)free.push([cur,Math.min(b[0],21*60)]);cur=Math.max(cur,b[1])});
  if(cur<21*60)free.push([cur,21*60]);
  return {free:free.filter(f=>f[1]-f[0]>=60),busy,notes};
}
function aiFreeLabel(f){
  if(f.length===1&&f[0][0]===480&&f[0][1]===1260)return 'ganzer Tag frei';
  return f.map(x=>x[1]===1260?'ab '+shortT(m2hm(x[0]))+' Uhr':shortT(m2hm(x[0]))+'–'+shortT(m2hm(x[1]))+' Uhr').join(', ');
}
function aiAddBtn(k,time,label){return '<button class="aibtn" data-ai-new="'+k+'"'+(time?' data-ai-time="'+time+'"':'')+'>'+(label||'+ Termin')+'</button>'}
function assist(q){
  const l=q.toLowerCase().trim();if(l.length<3)return null;
  const t=today();
  /* Termin eintragen */
  if(/^(bitte\s+)?(trag|trage|eintragen|neuer termin|neuen termin|termin\s*:|erstell|erstelle|plane?|leg|lege|füg|füge|merk)/.test(l)||/\b(eintragen|einplanen)\b/.test(l)){
    let rest=q.replace(/^(bitte\s+)?(trag(e)?|neue[rn]? termin|termin\s*:|erstell(e)?|plan(e)?|leg(e)?|füg(e)?|merk(e)?(\s+dir)?)\s*(mal\s+)?(bitte\s+)?(einen\s+|ein\s+|den\s+|die\s+)?(termin\s+)?/i,'').replace(/\s+(ein|eintragen|einplanen|an|hinzu|bitte|in den kalender|im kalender)\s*[.!]?\s*$/i,'');
    const dt=aiDate(rest);if(dt)rest=rest.slice(0,dt.i)+' '+rest.slice(dt.i+dt.len);
    const tm=aiTime(rest);if(tm)rest=rest.slice(0,tm.i)+' '+rest.slice(tm.i+tm.len);
    const persons=aiPersons(rest);
    rest=rest.replace(/\b(mit|für)\s+((?:[A-ZÄÖÜa-zäöü]+)(?:\s*(?:,|und)\s*[A-ZÄÖÜa-zäöü]+)*)/gi,(all,w,names)=>names.split(/\s*(?:,|und)\s*/).every(x=>HUMANS().some(n=>n.toLowerCase()===x.toLowerCase())||/^(mir|mich|uns|allen)$/i.test(x))?' ':all);
    let place='';const pm=/\b(?:in|bei|im|beim)\s+((?:der\s+|dem\s+)?[A-ZÄÖÜ][\wäöüß\-]*(?:\s+[A-ZÄÖÜ][\wäöüß\-]*)*)/.exec(rest);
    if(pm){place=pm[1].replace(/^(der|dem)\s+/,'');rest=rest.slice(0,pm.index)+' '+rest.slice(pm.index+pm[0].length)}
    let title=rest.replace(/\b(am|um|ab|einen|ein|eine|termin|uhr)\b/gi,' ').replace(/[,.!]+/g,' ').replace(/\s+/g,' ').trim();
    if(title)title=title[0].toUpperCase()+title.slice(1);
    const draft={title,place,date:dt?key(dt.d):'',time:tm?tm.v:'',persons};S.aiDraft=draft;
    const ok=title&&draft.date;
    return '<p>'+(ok?'So würde ich den Termin eintragen:':'Fast, mir fehlt noch '+(!title?'der Titel':'das Datum')+'.')+'</p><ul class="ailist"><li><span><b>'+esc(title||'Ohne Titel')+'</b><small>'+(draft.date?WD[parse(draft.date).getDay()]+', '+parse(draft.date).getDate()+'. '+MO[parse(draft.date).getMonth()]:'Datum fehlt')+(draft.time?' · '+draft.time+' Uhr':' · ganztägig')+(place?' · '+esc(place):'')+(persons.length?' · mit '+esc(persons.join(', ')):'')+'</small></span></li></ul><div class="row" style="margin-top:10px">'+(ok&&S.canWrite?'<button class="aibtn" data-ai-save>Eintragen</button>':'')+'<button class="aibtn ghost" data-ai-edit>'+(ok?'Vorher ändern':'Ergänzen')+'</button></div>';
  }
  /* Freie Zeit */
  if(/\b(zeit|frei|freie|verfügbar|passt|lücke|kann man|können wir)\b/.test(l)&&!/wetter/.test(l)){
    const r=aiRange(q)||{from:t,to:addDays(t,6),label:'die nächsten 7 Tage'};
    let persons=aiPersons(q);if(!persons.length)persons=HUMANS();
    const tm=aiTime(q),days=[];
    for(let d=new Date(r.from);d<=r.to&&days.length<62;d=addDays(d,1))if(d>=t)days.push(new Date(d));
    let res=days.map(d=>({d,...aiFree(d,persons)}));
    if(tm){const v=hm2m(tm.v);res=res.filter(x=>x.free.some(f=>f[0]<=v&&f[1]>=v+60))}
    else res=res.filter(x=>x.free.length);
    const missing=persons.filter(n=>!S.sched[n]);
    const who=persons.length===HUMANS().length?'alle':persons.join(' & ');
    if(!res.length)return '<p>'+r.label[0].toUpperCase()+r.label.slice(1)+' finde ich leider keine freie Zeit für '+esc(who)+(tm?' um '+tm.v+' Uhr':'')+'.</p>';
    const shown=res.slice(0,10);
    return '<p>Frei für '+esc(who)+' · '+esc(r.label)+(tm?' um '+shortT(tm.v)+' Uhr':'')+':</p><ul class="ailist">'+shown.map(x=>{const st=tm?tm.v:(x.free[0][0]===480?'':m2hm(x.free[0][0]));return '<li><span><b>'+aiFmt(x.d)+'</b><small>'+(tm?'um '+shortT(tm.v)+' Uhr frei':aiFreeLabel(x.free))+(x.notes.length?' · '+esc(x.notes.join(', ')):'')+'</small></span>'+(S.canWrite?aiAddBtn(key(x.d),st):'')+'</li>'}).join('')+'</ul>'+(res.length>shown.length?'<p class="small muted" style="margin-top:8px">… und '+(res.length-shown.length)+' weitere Tage.</p>':'')+(missing.length?'<p class="small muted" style="margin-top:8px">Für '+esc(missing.join(', '))+' sind noch keine Arbeits- oder Schulzeiten eingetragen, da zählen nur die Termine.</p>':'');
  }
  /* Wetter */
  if(/wetter|regen|regnet|schirm|warm|kalt|temperatur|grad|sonne|schnee|gewitter|wind/.test(l)){
    if(!S.wx)return '<p>Das Wetter ist gerade nicht geladen. Bitte gleich nochmal versuchen.</p>';
    const dt=aiDate(q),d=dt?dt.d:t,di=diffDays(t,d),w=S.wx;
    if(di<0||di>6)return '<p>Die Vorhersage reicht nur 7 Tage weit.</p>';
    const h=w.hourly,i0=di*24+(di===0?new Date().getHours():0),idx=[];for(let i=i0;i<(di+1)*24&&i<h.time.length;i++)idx.push(i);
    const [em,tx]=wmo(w.daily.weather_code[di],1),rp=Math.max(0,...idx.map(i=>h.precipitation_probability[i]||0));
    const wet=idx.filter(i=>(h.precipitation_probability[i]||0)>=50).map(i=>+h.time[i].slice(11,13));
    const ranges=[];wet.forEach(x=>{const r=ranges[ranges.length-1];if(r&&r[1]===x-1)r[1]=x;else ranges.push([x,x])});
    const lbl=di===0?'Heute':di===1?'Morgen':WD[d.getDay()];
    let ans='<p><b>'+lbl+' in Todendorf:</b> '+em+' '+tx+', '+Math.round(w.daily.temperature_2m_min[di])+'° bis '+Math.round(w.daily.temperature_2m_max[di])+'°.</p>';
    if(/regen|regnet|schirm|nass/.test(l))ans+='<p>'+(rp>=60?'Ja, Regen ist ziemlich wahrscheinlich ('+rp+' %).':rp>=30?'Vielleicht, die Regenwahrscheinlichkeit liegt bei bis zu '+rp+' %.':'Eher nicht, höchstens '+rp+' % Regenwahrscheinlichkeit.')+(ranges.length?' Am ehesten '+ranges.map(r=>r[0]===r[1]?'um '+r[0]+' Uhr':'zwischen '+r[0]+' und '+(r[1]+1)+' Uhr').join(' und ')+'.':'')+(rp>=40?' Schirm einpacken! ☂️':'')+'</p>';
    else ans+='<p>Regen bis '+rp+' %'+(ranges.length?', am ehesten '+ranges.map(r=>r[0]===r[1]?'um '+r[0]+' Uhr':r[0]+'–'+(r[1]+1)+' Uhr').join(', '):'')+'.</p>';
    return ans+'<button class="aibtn ghost" data-ai-wx>Stunde für Stunde ansehen</button>';
  }
  /* Müll */
  if(/müll|tonne|abfuhr|gelbe|gelber sack|papier|bio|restmüll|restabfall/.test(l)){
    const pick=/gelb|wertstoff/.test(l)?'gelb':/bio|braun/.test(l)?'bio':/papier|blau/.test(l)?'papier':/rest|grau|schwarz/.test(l)?'rest':'';
    const list=BINS.filter(b=>!pick||b.id===pick).map(b=>({b,d:nextPickup(b,t)})).filter(x=>x.d).sort((a,b)=>a.d-b.d);
    if(!list.length)return '<p>Dafür ist noch kein Abholtermin eingetragen.</p>';
    return '<ul class="ailist">'+list.map(x=>'<li><span><b>'+x.b.n+'</b><small>'+aiFmt(x.d)+' · '+relDay(diffDays(t,x.d))+'</small></span></li>').join('')+'</ul>'+(diffDays(t,list[0].d)===1?'<p class="small" style="margin-top:8px">Heute Abend rausstellen! 🗑️</p>':'');
  }
  /* Wer ist zuhause */
  if(/zuhause|zu hause|daheim|wer ist (da|weg)|auf der arbeit|in der schule|homeoffice|arbeitet|feierabend|wann kommt/.test(l)){
    let at=new Date();const dt=aiDate(q),tm=aiTime(q);
    if(dt){at=new Date(dt.d);if(!tm)at.setHours(new Date().getHours(),new Date().getMinutes())}

  }
  /* Geburtstage */
  if(/geburtstag|wird .* alt|wie alt/.test(l)){
    const all=bdaysAll().map(b=>{const n=bdNext(b);return {b,n,days:diffDays(t,n),turns:bdAge(b,n.getFullYear())}});
    let hits=all.filter(x=>l.includes(String(x.b.name).toLowerCase()));
    if(!hits.length)hits=all.sort((a,b)=>a.days-b.days).slice(0,3);
    return '<ul class="ailist">'+hits.map(x=>'<li><span><b>🎂 '+esc(x.b.name)+'</b><small>'+aiFmt(x.n)+' · '+relDay(x.days)+(x.turns?' · wird '+x.turns:'')+'</small></span></li>').join('')+'</ul>';
  }
  /* Bella */
  if(/bella|hund|gassi|futter|medikament/.test(l)){
    const open=BELLA_TASKS.filter(x=>!isDone(t,x)),done=BELLA_TASKS.filter(x=>isDone(t,x));

  }
  /* Punkte */
  if(/punkte|führt|rangliste|gewinnt|wer hat am meisten/.test(l)){
    const rk=ranking();return rk.length?'<ul class="ailist">'+rk.map((r,i)=>'<li><span><b>'+(i===0?'🏆 ':'')+esc(r[0])+'</b></span><span class="small">'+r[1]+' P.</span></li>').join('')+'</ul>':'<p>Diese Woche hat noch niemand Punkte.</p>';
  }
  /* Einkauf */
  if(/einkauf|einkaufen|kaufen|fehlt|einkaufsliste/.test(l)){
    const open=S.shop.filter(x=>!x.done);
    return open.length?'<p>Auf der Einkaufsliste '+(open.length===1?'steht':'stehen')+' '+open.length+':</p><p>'+open.map(x=>esc(x.text)).join(', ')+'</p>':'<p>Die Einkaufsliste ist leer.</p>';
  }
  /* Aufgaben */
  if(/aufgabe|zu tun|erledigen|offen|was muss/.test(l)){
    const open=tasksFor(t).filter(x=>!isDone(t,x)).concat(BELLA_TASKS.filter(x=>!isDone(t,x)));
    return open.length?'<p>Heute noch offen:</p><ul class="ailist">'+open.map(x=>'<li><span><b>'+esc(x.t)+'</b><small>'+(x.due?'bis '+x.due+' Uhr':SLOTS.concat(BELLA_SLOTS).find(s=>s[0]===x.slot)[1])+(x.who?' · für '+esc(x.who):'')+'</small></span></li>').join('')+'</ul>':'<p>Heute ist alles erledigt. 🎉</p>';
  }
  /* Termine / was steht an */
  if(/termin|steht|was ist|was haben|was gibt|kalender|programm|vorhaben|los\b|an\?$|plan/.test(l)||aiRange(q)){
    const r=aiRange(q)||{from:t,to:addDays(t,1),label:'heute und morgen'};
    const persons=aiPersons(q),rows=[];
    for(let d=new Date(r.from);d<=r.to&&rows.length<40;d=addDays(d,1)){itemsOn(d).forEach(it=>{if(persons.length&&it.kind==='ev'&&it.e.persons&&it.e.persons.length&&!it.e.persons.some(p=>persons.includes(p)))return;rows.push({d:new Date(d),it})})}
    if(!rows.length)return '<p>'+r.label[0].toUpperCase()+r.label.slice(1)+' steht nichts im Kalender.</p>'+(S.canWrite&&r.single?aiAddBtn(key(r.from),'','+ Termin eintragen'):'');
    return '<p>'+esc(r.label[0].toUpperCase()+r.label.slice(1))+':</p><ul class="ailist">'+rows.map(x=>{const it=x.it;const title=it.kind==='ev'?it.e.title:it.kind==='bd'?'🎂 '+it.b.name+(it.age?' wird '+it.age:''):'🗑️ '+it.bin.n;const sub=aiFmt(x.d)+(it.kind==='ev'&&it.e.time&&it.k===it.e.date?' · '+it.e.time+' Uhr':'')+(it.kind==='ev'&&evMulti(it.e)?' · '+evSpan(it.e,it.k):'')+(it.kind==='ev'&&it.e.place?' · '+it.e.place:'')+(it.kind==='ev'&&it.e.persons&&it.e.persons.length?' · '+it.e.persons.join(', '):'');return '<li><span><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></span></li>'}).join('')+'</ul>';
  }
  return null;
}

function gemMd(s){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,!?:;]|$)/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const out=[];let list=null;
  const flush=()=>{if(list){out.push('<'+list.t+' class="aimd">'+list.i.map(x=>'<li>'+x+'</li>').join('')+'</'+list.t+'>');list=null}};
  let para=[];const fp=()=>{if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[]}};
  String(s||'').replace(/\r/g,'').split('\n').forEach(line=>{
    const l=line.trim();let m;
    if(!l){fp();flush();return}
    if((m=l.match(/^[-*•]\s+(.*)$/))){fp();if(!list||list.t!=='ul'){flush();list={t:'ul',i:[]}}list.i.push(inl(m[1]));return}
    if((m=l.match(/^\d+[.)]\s+(.*)$/))){fp();if(!list||list.t!=='ol'){flush();list={t:'ol',i:[]}}list.i.push(inl(m[1]));return}
    flush();
    if((m=l.match(/^#{1,4}\s+(.*)$/))){fp();out.push('<p><b>'+inl(m[1])+'</b></p>');return}
    para.push(inl(l));
  });
  fp();flush();return out.join('')||'<p>…</p>';
}

function gemHistory(text){
  const c=[];
  (S.chat||[]).slice(-21,-1).forEach(m=>{
    const role=m.r==='u'?'user':'model',tx=m.r==='u'?m.t:(m.g||gemText(m.h));if(!tx)return;
    if(c.length&&c[c.length-1].role===role)c[c.length-1].parts[0].text+='\n'+tx;else c.push({role,parts:[{text:tx}]});
  });
  while(c.length&&c[0].role!=='user')c.shift();
  if(c.length&&c[c.length-1].role==='user')c.pop();
  c.push({role:'user',parts:[{text}]});return c;
}
async function gemCall(body){
  const pref=lsGet('frahm-gem-model'),list=pref&&GEM_MODELS.includes(pref)?[pref].concat(GEM_MODELS.filter(x=>x!==pref)):GEM_MODELS;
  let last;
  for(const m of list){
    let r;try{r=await fetch(GEM_URL+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':gemKey()},body:JSON.stringify(body)})}catch(e){throw {net:true}}
    if(r.ok){lsSet('frahm-gem-model',m);return r.json()}
    let j={};try{j=await r.json()}catch(e){}
    const msg=(j.error&&j.error.message)||'';last={status:r.status,msg};
    if(r.status===400&&/api key|API_KEY/i.test(msg+JSON.stringify(j)))throw {key:true};
    if(r.status===401||r.status===403)throw {key:true,msg};
    if(r.status===404||r.status===429||r.status>=500)continue;
    throw last;
  }
  throw last||{};
}

const WX_URL='https://api.open-meteo.com/v1/forecast?latitude=53.6927&longitude=10.3466&timezone=Europe%2FBerlin&forecast_days=7'+
  '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation,is_day'+
  '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,is_day'+
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset';
function wmo(c,day){
  c=+c;const n=day===0;
  if(c===0)return [n?'🌙':'☀️','Klar'];
  if(c===1)return [n?'🌙':'🌤️','Überwiegend klar'];
  if(c===2)return [n?'☁️':'⛅','Teilweise bewölkt'];
  if(c===3)return ['☁️','Bedeckt'];
  if(c===45||c===48)return ['🌫️','Nebel'];
  if(c>=51&&c<=55)return ['🌦️','Nieselregen'];
  if(c===56||c===57)return ['🌧️','Gefrierender Niesel'];
  if(c===61)return ['🌦️','Leichter Regen'];
  if(c===63)return ['🌧️','Regen'];
  if(c===65)return ['🌧️','Starker Regen'];
  if(c===66||c===67)return ['🌧️','Gefrierender Regen'];
  if(c>=71&&c<=77)return ['🌨️','Schnee'];
  if(c>=80&&c<=82)return ['🌦️','Regenschauer'];
  if(c===85||c===86)return ['🌨️','Schneeschauer'];
  if(c>=95)return ['⛈️','Gewitter'];
  return ['🌡️','Wetter'];
}

/* Zwei Diagramme mit je eigener Achse: Temperatur als Linie, Regenwahrscheinlichkeit als Balken */
function wxCharts(day,sel){
  const h=S.wx.hourly,start=day*24,idx=[...Array(24).keys()].map(i=>start+i).filter(i=>i<h.time.length);
  const W=340,L=28,Rt=8,cw=(W-L-Rt)/24,x=j=>L+cw*j+cw/2;
  const temps=idx.map(i=>h.temperature_2m[i]),lo=Math.floor(Math.min(...temps))-1,hi=Math.ceil(Math.max(...temps))+1,TH=120,tY=v=>10+(hi-v)/(hi-lo)*(TH-30);
  let t='<svg class="wxchart" viewBox="0 0 '+W+' '+TH+'" role="img" aria-label="Temperatur pro Stunde">';
  [hi,Math.round((hi+lo)/2),lo].forEach(v=>{t+='<line x1="'+L+'" x2="'+(W-Rt)+'" y1="'+tY(v)+'" y2="'+tY(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(tY(v)+3)+'" text-anchor="end">'+v+'°</text>'});
  t+='<path d="'+temps.map((v,j)=>(j?'L':'M')+x(j).toFixed(1)+' '+tY(v).toFixed(1)).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  if(sel!=null&&temps[sel]!=null)t+='<line x1="'+x(sel)+'" x2="'+x(sel)+'" y1="6" y2="'+(TH-18)+'" stroke="var(--muted)" stroke-dasharray="3 3"/><circle cx="'+x(sel)+'" cy="'+tY(temps[sel])+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  [0,3,6,9,12,15,18,21].forEach(j=>{t+='<text x="'+x(j)+'" y="'+(TH-4)+'" text-anchor="middle">'+j+'</text>'});
  idx.forEach((i,j)=>{t+='<rect data-hr="'+j+'" x="'+(L+cw*j)+'" y="0" width="'+cw+'" height="'+TH+'" fill="transparent"/>'});
  t+='</svg>';
  const RH=90,rY=v=>8+(100-v)/100*(RH-26);
  let r='<svg class="wxchart" viewBox="0 0 '+W+' '+RH+'" role="img" aria-label="Regenwahrscheinlichkeit pro Stunde">';
  [100,50,0].forEach(v=>{r+='<line x1="'+L+'" x2="'+(W-Rt)+'" y1="'+rY(v)+'" y2="'+rY(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(rY(v)+3)+'" text-anchor="end">'+v+'%</text>'});
  idx.forEach((i,j)=>{const v=h.precipitation_probability[i]||0;if(v>0){const y=rY(v),bw=cw-2;r+='<path d="M'+(L+cw*j+1)+' '+rY(0)+'V'+(y+Math.min(4,rY(0)-y))+'q0 -4 4 -4h'+(bw-8)+'q4 0 4 4V'+rY(0)+'Z" fill="var(--papier)"'+(sel!=null&&sel!==j?' opacity=".45"':'')+'/>'}});
  [0,3,6,9,12,15,18,21].forEach(j=>{r+='<text x="'+x(j)+'" y="'+(RH-4)+'" text-anchor="middle">'+j+'</text>'});
  idx.forEach((i,j)=>{r+='<rect data-hr="'+j+'" x="'+(L+cw*j)+'" y="0" width="'+cw+'" height="'+RH+'" fill="transparent"/>'});
  r+='</svg>';
  return {t,r,idx};
}

    $('#cancel').onclick=()=>{host.innerHTML=''};
    $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')host.innerHTML=''});

/* ---------- Push-Nachrichten ----------
   Das Handy meldet sich hier an; der GitHub-Dienst (.github/push/send.mjs) schickt die Nachrichten.
   Das Schlüsselpaar entsteht einmalig hier im Browser: der öffentliche Teil kommt nach config/push,
   der geheime nur in das GitHub-Secret PUSH_GEHEIM. */
function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function pushId(ep){let h=2166136261;for(let i=0;i<ep.length;i++){h^=ep.charCodeAt(i);h=Math.imul(h,16777619)}return 'p'+(h>>>0).toString(36)+ep.length.toString(36)}
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function pushBody(){
  let body;
  if(S.pushCfg===null&&S.canWrite)body='<p class="small muted" style="margin:0">Wird geladen …</p>';
  else if(!S.pushCfg||!S.pushCfg.vapidPublic)body='<button class="btn" id="pushSetup"'+(S.canWrite?'':' disabled')+'>Einmal einrichten</button>';
  else if(S.push==='on')body='<p class="small muted" style="margin:0 0 10px">An'+(S.name?' für '+esc(S.name):'')+'</p><button class="btn ghost" id="pushOff">Ausschalten</button>';
  else if(!pushSupported())body='<p class="small muted" style="margin:0">'+(isIOS()&&!isStandalone()?'Nur in der App vom Home-Bildschirm.':'Hier nicht möglich.')+'</p>';
  else if(Notification.permission==='denied')body='<p class="small muted" style="margin:0">In den Handy-Einstellungen blockiert.</p>';
  else body='<button class="btn" id="pushOn"'+(S.canWrite?'':' disabled')+'>Benachrichtigungen erlauben</button>';
  return body.replace('<p class="small muted" style="margin:0 0 10px">An'+(S.name?' für '+esc(S.name):'')+'</p>','');
}
function bindPush(el){

async function pushReg(){return navigator.serviceWorker.ready}
async function pushSave(){
  try{const r=await pushReg(),sub=await r.pushManager.getSubscription();if(!sub||!S.db)return false;
    const j=sub.toJSON();const n=S.notify,prefs={};NOTIFY.forEach(x=>prefs[x[0]]=n[x[0]]!==false);
    await S.db.collection('push').doc(pushId(j.endpoint)).set({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,name:S.name||'',ua:navigator.userAgent.slice(0,120),at:Date.now(),prefs,mine:!!n.mine,quiet:!!n.quiet});return true}catch(e){handleWriteError(e);return false}

async function pushEnable(){
  const b=$('#pushOn');if(b){b.disabled=true;b.textContent='Einen Moment …'}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Nachrichten wurden nicht erlaubt');S.push='off';renderFamily();return}
    const r=await pushReg();

  }catch(e){toast('Hat nicht geklappt, bitte nochmal versuchen');S.push='off'}

async function pushDisable(){

function b64e(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function pushSetup(){
  let pub,priv;
  try{const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']);
    pub=b64e(await crypto.subtle.exportKey('raw',k.publicKey));priv=(await crypto.subtle.exportKey('jwk',k.privateKey)).d}catch(e){toast('Dieser Browser kann das leider nicht');return}
  const secret=(lsGet('frahm-code')||'')+'|'+priv;

    '<div class="row"><button class="btn" type="button" id="pDone" style="flex:1">In GitHub gespeichert</button><button class="btn ghost" type="button" id="cancel">Abbrechen</button></div></div></div>';
  const close=()=>{host.innerHTML=''};

  $('#pDone').onclick=async()=>{try{await S.db.collection('config').doc('push').set({vapidPublic:pub,at:Date.now(),by:S.name||''});close();toast('Eingerichtet! Jetzt Benachrichtigungen erlauben')}catch(e){handleWriteError(e)}};
}

/* ---------- Pakete ----------
   Firestore "packages": {raw,url,nr,carrier,label,for,by,at,status,statusAt,statusBy,receivedBy,receivedAt,autoText,autoAt}
   status: unterwegs | heute (kommt heute) | zugestellt (laut Paketdienst) | da (von der Familie angenommen)
   autoText/status "heute"/"zugestellt" schreibt bei DHL auch der Push-Dienst (.github/push/send.mjs), wenn DHL_KEY gesetzt ist. */
const CARRIERS={
  dhl:{n:'DHL',ab:'DHL',bg:'#FFCC00',fg:'#D40511',url:n=>'https://www.dhl.de/de/privatkunden/pakete-empfangen/verfolgen.html?piececode='+encodeURIComponent(n)},
  amazon:{n:'Amazon',ab:'a',bg:'#FF9900',fg:'#131A22',url:n=>'https://www.amazon.de/gp/css/order-history'},
  hermes:{n:'Hermes',ab:'H',bg:'#0091CD',fg:'#FFFFFF',url:n=>'https://www.myhermes.de/empfangen/sendungsverfolgung/sendungsinformation#'+encodeURIComponent(n)},
  dpd:{n:'DPD',ab:'DPD',bg:'#DC0032',fg:'#FFFFFF',url:n=>'https://tracking.dpd.de/status/de_DE/parcel/'+encodeURIComponent(n)},
  gls:{n:'GLS',ab:'GLS',bg:'#F8D400',fg:'#061AB1',url:n=>'https://gls-group.com/DE/de/paketverfolgung?match='+encodeURIComponent(n)},
  ups:{n:'UPS',ab:'UPS',bg:'#FFB500',fg:'#351C15',url:n=>'https://www.ups.com/track?loc=de_DE&tracknum='+encodeURIComponent(n)},
  fedex:{n:'FedEx',ab:'FX',bg:'#4D148C',fg:'#FFFFFF',url:n=>'https://www.fedex.com/fedextrack/?trknbr='+encodeURIComponent(n)},
  other:{n:'Anderer',ab:'📦',bg:'#1A2438',fg:'#EAF0FB',url:n=>'https://parcelsapp.com/de/tracking/'+encodeURIComponent(n)}
};
function carrierOf(p){return CARRIERS[p&&p.carrier]||CARRIERS.other}
function crBadge(c,cls){const x=CARRIERS[c]||CARRIERS.other;return '<span class="cr'+(cls?' '+cls:'')+'" style="--cb:'+x.bg+';--cf:'+x.fg+'" aria-hidden="true">'+x.ab+'</span>'}
/* Sendungsnummer -> Paketdienst. Nicht immer eindeutig (z. B. 14 Ziffern: DPD oder Hermes), darum kann man es im Formular ändern. */
function guessCarrier(n){
  if(/^TBA\d{9,}$/.test(n))return 'amazon';
  if(/^1Z[0-9A-Z]{16}$/.test(n))return 'ups';
  if(/^(JJD|JVGL)[0-9A-Z]+$/.test(n)||/^3S[0-9A-Z]{8,}$/.test(n)||/^[A-Z]{2}\d{9}DE$/.test(n)||/^\d{12}$/.test(n)||/^\d{20}$/.test(n))return 'dhl';
  if(/^0\d{13}$/.test(n)||/^\d{27,28}$/.test(n))return 'dpd';
  if(/^H\d{10,20}$/.test(n)||/^\d{14}$/.test(n)||/^\d{16}$/.test(n))return 'hermes';
  if(/^\d{11}$/.test(n))return 'gls';
  return 'other';
}
function parsePkg(raw){
  raw=String(raw||'').trim();let url='',nr='',carrier='',label='';
  const m=raw.match(/https?:\/\/[^\s<>"]+/i);
  if(m){
    url=m[0].replace(/[),.;!]+$/,'');
    let u=null;try{u=new URL(url)}catch(e){}
    if(u){
      const h=u.hostname.toLowerCase();
      carrier=/(^|\.)(amazon|amzn)\./.test(h)||/amzn\.to$/.test(h)?'amazon':/dhl\.|deutschepost|deutsche-post/.test(h)?'dhl':/dpd\./.test(h)?'dpd':/hermes/.test(h)?'hermes':/gls/.test(h)?'gls':/ups\.com$/.test(h)?'ups':/fedex\./.test(h)?'fedex':'';
      const ps=u.searchParams;
      for(const k of ['piececode','idc','tracking-id','trackingId','trackingNumber','trackingnumber','tracknum','trknbr','parcelNumber','parcelno','match','shipmentId','sendungsnummer','tracking','query']){const v=(ps.get(k)||'').replace(/\s+/g,'');if(/^[A-Za-z0-9]{8,35}$/.test(v)&&/\d{4}/.test(v)){nr=v;break}}
      if(!nr&&carrier!=='amazon'){const seg=(u.pathname+'/'+u.hash.slice(1)).split(/[\/#?&=]/).reverse().find(x=>/^[A-Za-z0-9]{10,35}$/.test(x)&&/\d{6}/.test(x));if(seg)nr=seg}
    }
    label=raw.replace(m[0],'').trim().slice(0,60);
  }else{
    const c=raw.replace(/[\s-]+/g,'');
    if(/^[A-Za-z0-9]{8,35}$/.test(c)&&/\d{5}/.test(c))nr=c;else label=raw.slice(0,60);
  }
  nr=nr.toUpperCase();
  if(!carrier)carrier=nr?guessCarrier(nr):(/amazon/i.test(raw)?'amazon':/dhl/i.test(raw)?'dhl':/hermes/i.test(raw)?'hermes':/dpd/i.test(raw)?'dpd':/gls/i.test(raw)?'gls':'other');
  return {url,nr,carrier,label};
}
function trackUrl(p){if(p.url)return p.url;const c=carrierOf(p);if(p.nr)return c.url(p.nr);return p.carrier==='amazon'?c.url(''):''}
/* "Kommt heute" gilt nur für den Tag, an dem es gesetzt wurde. */
function pkgState(p){

  if(p.status==='zugestellt')return 'zugestellt';

  if(st!=='da')h+='<div class="acts">'+(link?'<a class="btn ghost sm" href="'+esc(link)+'" target="_blank" rel="noopener">Verfolgen ↗</a>':'')+(w&&st!=='zugestellt'?'<button class="btn ghost sm'+(st==='heute'?' on':'')+'" data-ph="'+esc(p.id)+'">'+(st==='heute'?'✓ Kommt heute':'Kommt heute')+'</button>':'')+'</div>';

    '<div><h3>Für wen?</h3><div class="chips" id="pkgWho"><button type="button" class="chip" data-w="" aria-pressed="'+(who==='')+'">Für alle</button>'+people.map(x=>'<button type="button" class="chip" data-w="'+x.n+'" aria-pressed="'+(who===x.n)+'">'+x.n+'</button>').join('')+'</div></div>'+
    (d.url?'<p class="small muted" style="margin:0;overflow-wrap:anywhere">Link: '+esc(d.url.length>70?d.url.slice(0,70)+'…':d.url)+'</p>':'')+
    (d.carrier==='amazon'||carrier==='amazon'?'<p class="small muted" style="margin:0">Amazon-Links öffnen sich nur im Amazon-Konto, mit dem bestellt wurde. Steht in der Versand-Mail eine DHL-, Hermes- oder DPD-Nummer, lieber die eintragen.</p>':'')+

  host.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{carrier=b.dataset.c;host.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
  host.querySelectorAll('[data-w]').forEach(b=>b.addEventListener('click',()=>{who=b.dataset.w;host.querySelectorAll('[data-w]').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
  $('#pkgNr').addEventListener('input',e=>{const n=e.target.value.replace(/[\s-]+/g,'').toUpperCase();if(isNew&&!d.url&&n.length>=8){const g=guessCarrier(n);if(g!=='other'){carrier=g;host.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===g))}}});

    e.preventDefault();
